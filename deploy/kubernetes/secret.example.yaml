apiVersion: v1
kind: Secret
metadata:
  name: unrealdb-secrets
  namespace: unrealdb
type: Opaque
stringData:
  UNREALDB_DB_HOST: mysql.example.internal
  UNREALDB_DB_PORT: "3306"
  UNREALDB_DB_NAME: unrealdb
  UNREALDB_DB_USER: unrealdb
  UNREALDB_DB_PASSWORD: replace-with-secret-manager-value
  UNREALDB_SESSION_REDIS_DSN: tcp://redis.example.internal:6379?database=1&timeout=2.5&read_timeout=2.5
  # Generate with: php catalog/bin/generate-federation-master-key.php
  UNREALDB_FEDERATION_MASTER_KEY: base64:replace-with-32-byte-base64-key
