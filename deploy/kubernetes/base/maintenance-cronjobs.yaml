apiVersion: batch/v1
kind: CronJob
metadata:
  name: unrealdb-prune-artifacts
  namespace: unrealdb
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: enqueue
              image: ghcr.io/ardenee/ut_reader:latest
              imagePullPolicy: IfNotPresent
              command:
                - php
                - /var/www/html/catalog/bin/job-control.php
                - enqueue-prune-artifacts
                - --incoming-max-age-seconds=172800
              envFrom:
                - configMapRef:
                    name: unrealdb-config
                - secretRef:
                    name: unrealdb-secrets
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: unrealdb-reconcile-unverified
  namespace: unrealdb
spec:
  schedule: "47 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: enqueue
              image: ghcr.io/ardenee/ut_reader:latest
              imagePullPolicy: IfNotPresent
              command:
                - php
                - /var/www/html/catalog/bin/job-control.php
                - enqueue-reconcile-unverified
                - --max-files=1000
              envFrom:
                - configMapRef:
                    name: unrealdb-config
                - secretRef:
                    name: unrealdb-secrets
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
