apiVersion: v1
kind: Namespace
metadata:
  name: unrealdb
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unrealdb-config
  namespace: unrealdb
data:
  UNREALDB_SITE_NAME: Unreal File Catalog
  UNREALDB_STORAGE_PATH: /var/www/html/catalog/storage
  UNREALDB_MAX_UPLOAD_BYTES: "268435456"
  UNREALDB_REMEMBER_DAYS: "30"
  UNREALDB_SESSION_COOKIE_SECURE: "1"
  UNREALDB_CATALOG_SESSION_IDLE_SECONDS: "1800"
  UNREALDB_CATALOG_SESSION_ABSOLUTE_SECONDS: "43200"
  UNREALDB_LOGIN_MAX_ATTEMPTS: "8"
  UNREALDB_LOGIN_WINDOW_SECONDS: "900"
  UNREALDB_LOGIN_BLOCK_SECONDS: "900"
  UNREALDB_API_MAX_JSON_BYTES: "1048576"
  UNREALDB_FEDERATION_MAX_JSON_BYTES: "8388608"
  UNREALDB_REDIRECT_MAX_OUTPUT_BYTES: "268435456"
  UNREALDB_ALLOW_LEGACY_QUERY_TOKENS: "0"
  UNREALDB_REQUIRE_ENCRYPTED_FEDERATION_SECRETS: "1"
  UNREALDB_QUEUE_NAME: catalog
  UNREALDB_QUEUE_LEASE_SECONDS: "120"
  UNREALDB_JOB_RESOURCE_LIMIT_DEPENDENCY_HEAVY: "1"
  UNREALDB_JOB_RESOURCE_LIMIT_STORAGE_HEAVY: "1"
  UNREALDB_JOB_RESOURCE_LIMIT_PACKAGE_HEAVY: "1"
  UNREALDB_JOB_RESOURCE_LIMIT_HOUSEKEEPING: "2"
  UNREALDB_JOB_RESOURCE_LIMIT_DEFAULT: "4"
  UNREALDB_GENERATED_PACKAGE_RETENTION_SECONDS: "86400"
  UNREALDB_PACKAGE_GENERATION_MAX_REQUESTS: "3"
  UNREALDB_PACKAGE_GENERATION_WINDOW_SECONDS: "600"
  UNREALDB_WORKER_MAX_JOBS: "100"
  UNREALDB_WORKER_SLEEP_MS: "250"
  UNREALDB_WORKER_IDLE_SECONDS: "2"
  UNREALDB_WORKER_ERROR_SECONDS: "10"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unrealdb-storage
  namespace: unrealdb
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unrealdb-web
  namespace: unrealdb
  labels:
    app.kubernetes.io/name: unrealdb
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: unrealdb
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unrealdb
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/ardenee/ut_reader:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: unrealdb-config
            - secretRef:
                name: unrealdb-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /catalog/api/v1/live.php
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /catalog/api/v1/health.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /catalog/api/v1/live.php
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/catalog/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: unrealdb-storage
---
apiVersion: v1
kind: Service
metadata:
  name: unrealdb-web
  namespace: unrealdb
  labels:
    app.kubernetes.io/name: unrealdb
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: unrealdb
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unrealdb-worker
  namespace: unrealdb
  labels:
    app.kubernetes.io/name: unrealdb
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: unrealdb
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unrealdb
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/ardenee/ut_reader:latest
          imagePullPolicy: IfNotPresent
          args:
            - /var/www/html/deploy/docker/worker-loop.sh
          envFrom:
            - configMapRef:
                name: unrealdb-config
            - secretRef:
                name: unrealdb-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "SETGID", "SETUID"]
          volumeMounts:
            - name: storage
              mountPath: /var/www/html/catalog/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: unrealdb-storage
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unrealdb
  namespace: unrealdb
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 256m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
