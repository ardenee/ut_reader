apiVersion: v1
kind: ConfigMap
metadata:
  name: unrealdb-config
  namespace: unrealdb
data:
  UNREALDB_ADMIN_REAUTH_SECONDS: "600"
  UNREALDB_PUBLIC_SEARCH_MAX_REQUESTS: "60"
  UNREALDB_PUBLIC_SEARCH_WINDOW_SECONDS: "600"
  UNREALDB_PUBLIC_DOWNLOAD_MAX_REQUESTS: "30"
  UNREALDB_PUBLIC_DOWNLOAD_WINDOW_SECONDS: "600"
  UNREALDB_FEDERATION_JOIN_MAX_REQUESTS: "5"
  UNREALDB_FEDERATION_JOIN_WINDOW_SECONDS: "3600"
  UNREALDB_FEDERATION_SIGNATURE_ALGORITHM: "hmac-sha256"
  UNREALDB_JOB_RESOURCE_LIMIT_IMPORT_HEAVY: "1"
  UNREALDB_STAGED_IMPORT_MAX_AGE_SECONDS: "172800"
  UNREALDB_RECONCILE_MAX_FILES: "1000"
