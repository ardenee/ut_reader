# Apply only after package storage supports ReadWriteMany or object storage and
# UNREALDB_SESSION_REDIS_DSN points to a production Redis service.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unrealdb-web
  namespace: unrealdb
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unrealdb-web
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: unrealdb-web
  namespace: unrealdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: unrealdb
      app.kubernetes.io/component: web
