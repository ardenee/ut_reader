<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
    LimitRequestBody 285212672

    php_admin_flag display_errors Off
    php_admin_flag display_startup_errors Off
    php_admin_flag log_errors On

    <Directory /var/www/html>
        Options FollowSymLinks -Indexes -ExecCGI -Includes
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <LocationMatch "^/(?:new|UE1|UE2|UE3|UE4|UE5)(?:/|$)">
        Require all denied
    </LocationMatch>

    <LocationMatch "^/catalog/(?:bin|lib|src|storage|tests|migrations)(?:/|$)">
        Require all denied
    </LocationMatch>

    <FilesMatch "^(?:config\.php|config\.example\.php)$">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.(?:log|sql|bak|tmp|ini)$">
        Require all denied
    </FilesMatch>

    Header always unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" "expr=%{HTTPS} == 'on'"
</VirtualHost>
