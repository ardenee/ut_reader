; Shared-hosting PHP defaults for browser-facing catalog requests.
; The application detects HTTPS before setting the Secure flag so local HTTP
; development remains possible; production must use HTTPS at the web server.
display_errors=0
display_startup_errors=0
log_errors=1
session.use_strict_mode=1
session.cookie_httponly=1
session.cookie_samesite=Lax
