; Shared-hosting PHP defaults for browser-facing catalog requests.
; Production catalog hosts must use HTTPS. Local HTTP development can override
; session.cookie_secure in its local PHP/vhost configuration.
display_errors=0
display_startup_errors=0
log_errors=1
session.use_strict_mode=1
session.cookie_httponly=1
session.cookie_samesite=Lax
session.cookie_secure=1
