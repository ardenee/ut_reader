services:
  web:
    environment: &unrealdb-security-environment
      UNREALDB_ADMIN_REAUTH_SECONDS: ${UNREALDB_ADMIN_REAUTH_SECONDS:-600}
      UNREALDB_SECURITY_MASTER_KEY: ${UNREALDB_SECURITY_MASTER_KEY:?UNREALDB_SECURITY_MASTER_KEY is required}
      UNREALDB_METRICS_TOKEN: ${UNREALDB_METRICS_TOKEN:-}
      UNREALDB_PUBLIC_SEARCH_MAX_REQUESTS: ${UNREALDB_PUBLIC_SEARCH_MAX_REQUESTS:-60}
      UNREALDB_PUBLIC_SEARCH_WINDOW_SECONDS: ${UNREALDB_PUBLIC_SEARCH_WINDOW_SECONDS:-600}
      UNREALDB_PUBLIC_DOWNLOAD_MAX_REQUESTS: ${UNREALDB_PUBLIC_DOWNLOAD_MAX_REQUESTS:-30}
      UNREALDB_PUBLIC_DOWNLOAD_WINDOW_SECONDS: ${UNREALDB_PUBLIC_DOWNLOAD_WINDOW_SECONDS:-600}
      UNREALDB_FEDERATION_JOIN_MAX_REQUESTS: ${UNREALDB_FEDERATION_JOIN_MAX_REQUESTS:-5}
      UNREALDB_FEDERATION_JOIN_WINDOW_SECONDS: ${UNREALDB_FEDERATION_JOIN_WINDOW_SECONDS:-3600}
      UNREALDB_FEDERATION_MASTER_KEY: ${UNREALDB_FEDERATION_MASTER_KEY:?UNREALDB_FEDERATION_MASTER_KEY is required}
      UNREALDB_REQUIRE_ENCRYPTED_FEDERATION_SECRETS: "1"
      UNREALDB_FEDERATION_SIGNATURE_ALGORITHM: ${UNREALDB_FEDERATION_SIGNATURE_ALGORITHM:-hmac-sha256}
      UNREALDB_FEDERATION_ED25519_PRIVATE_KEY: ${UNREALDB_FEDERATION_ED25519_PRIVATE_KEY:-}
      UNREALDB_JOB_RESOURCE_LIMIT_IMPORT_HEAVY: ${UNREALDB_JOB_RESOURCE_LIMIT_IMPORT_HEAVY:-1}
  worker:
    environment: *unrealdb-security-environment
  maintenance:
    image: unrealdb:${APP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started
    environment:
      <<: *unrealdb-security-environment
      UNREALDB_DB_HOST: mysql
      UNREALDB_DB_PORT: 3306
      UNREALDB_DB_NAME: unrealdb
      UNREALDB_DB_USER: unrealdb
      UNREALDB_DB_PASSWORD: ${UNREALDB_DB_PASSWORD:?UNREALDB_DB_PASSWORD is required}
      UNREALDB_STORAGE_PATH: /var/www/html/catalog/storage
      UNREALDB_QUEUE_NAME: catalog
      UNREALDB_MAINTENANCE_INTERVAL_SECONDS: ${UNREALDB_MAINTENANCE_INTERVAL_SECONDS:-86400}
      UNREALDB_STAGED_IMPORT_MAX_AGE_SECONDS: ${UNREALDB_STAGED_IMPORT_MAX_AGE_SECONDS:-172800}
      UNREALDB_RECONCILE_MAX_FILES: ${UNREALDB_RECONCILE_MAX_FILES:-1000}
    command: ["/var/www/html/deploy/docker/maintenance-loop.sh"]
    volumes:
      - catalog-storage:/var/www/html/catalog/storage
