name: One-time preserve original filenames

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-preserve-original-filenames.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, mbstring, openssl, sodium, zip
          coverage: none
      - name: Apply filename preservation changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          core = Path('catalog/lib/CatalogSupportCore.php')
          text = core.read_text(encoding='utf-8')
          marker = "function catalog_clean_unreal_filename(string $filename): string\n{\n"
          if text.count(marker) != 1:
              raise SystemExit('CatalogSupportCore filename marker changed')
          helper = r'''function catalog_original_unreal_filename(string $filename): string
{
    $filename = basename(str_replace(["\0", '/', '\\'], ['', DIRECTORY_SEPARATOR, DIRECTORY_SEPARATOR], $filename));
    $filename = preg_replace('/[\x00-\x1F\x7F]+/u', '', $filename) ?? $filename;
    $filename = trim($filename);
    $filename = rtrim($filename, " .");
    if ($filename === '' || $filename === '.' || $filename === '..') {
        return 'package';
    }

    do {
        $previous = $filename;

        // Download tools sometimes append the duplicate marker after the full
        // filename, for example Name.ut2 (2).
        $filename = preg_replace('/\s+\([0-9]+\)$/u', '', $filename) ?? $filename;

        // Normal duplicate names place the marker at the end of the stem. This
        // also fixes redirect names such as Name.uax (2).uz2 before decoding.
        $extension = (string)pathinfo($filename, PATHINFO_EXTENSION);
        if ($extension !== '') {
            $stem = (string)pathinfo($filename, PATHINFO_FILENAME);
            $stem = preg_replace('/\s+\([0-9]+\)$/u', '', $stem) ?? $stem;
            $stem = preg_replace('/\s+-\s+copy(?:\s*\([0-9]+\))?$/iu', '', $stem) ?? $stem;
            $stem = preg_replace('/\s+copy(?:\s*\([0-9]+\))?$/iu', '', $stem) ?? $stem;
            $filename = rtrim($stem, " .") . '.' . $extension;
        }

        $filename = trim($filename);
        $filename = rtrim($filename, " .");
    } while ($filename !== $previous);

    return $filename !== '' ? $filename : 'package';
}

'''
          core.write_text(text.replace(marker, helper + marker, 1), encoding='utf-8')

          replace_once(
              'catalog/lib/CatalogScanner.php',
              '''function scanner_clean_original_filename(string $originalName): string
{
    /*
     * catalog_clean_unreal_filename() intentionally normalizes unusual legacy
     * filenames, but '+' is a valid serialized UE4 package-name character.
     * Protect it while retaining the existing filename cleanup rules.
     */
    $placeholder = '__UE_PACKAGE_PLUS__';
    while (str_contains($originalName, $placeholder)) {
        $placeholder .= '_';
    }
    $clean = catalog_clean_unreal_filename(str_replace('+', $placeholder, $originalName));
    return str_replace($placeholder, '+', $clean);
}
''',
              '''function scanner_clean_original_filename(string $originalName): string
{
    // Database/display identity preserves the source filename exactly. Only
    // path/control bytes and duplicate-copy suffixes are removed here. Physical
    // staging names are sanitized separately and never become original_name.
    return catalog_original_unreal_filename($originalName);
}
'''
          )

          replace_once(
              'catalog/lib/CatalogRedirectArchive.php',
              '''function catalog_redirect_archive_output_name(string $filename): string
{
    $filename = basename(str_replace(["\\0", '/', '\\\\'], ['', DIRECTORY_SEPARATOR, DIRECTORY_SEPARATOR], $filename));
    $extension = catalog_redirect_archive_extension($filename);
    if ($extension === '') {
        return catalog_clean_unreal_filename($filename);
    }
    $base = substr($filename, 0, -strlen('.' . $extension));
    return catalog_clean_unreal_filename($base !== false && $base !== '' ? $base : 'package');
}
''',
              '''function catalog_redirect_archive_output_name(string $filename): string
{
    // Fix duplicate markers before inspecting/removing the redirect suffix:
    // Name.uax (2).uz2 -> Name.uax.uz2 -> Name.uax.
    $filename = catalog_original_unreal_filename($filename);
    $extension = catalog_redirect_archive_extension($filename);
    if ($extension === '') {
        return $filename;
    }
    $base = substr($filename, 0, -strlen('.' . $extension));
    return catalog_original_unreal_filename($base !== false && $base !== '' ? $base : 'package');
}
'''
          )

          replace_once(
              'catalog/source-scan.php',
              "if (!catalog_redirect_archive_is_supported_filename($name)) return ['path'=>$path,'name'=>catalog_clean_unreal_filename($name),'temp'=>false,'redirect'=>false,'source_extension'=>''];",
              "if (!catalog_redirect_archive_is_supported_filename($name)) return ['path'=>$path,'name'=>scanner_clean_original_filename($name),'temp'=>false,'redirect'=>false,'source_extension'=>''];"
          )
          replace_once(
              'catalog/source-scan.php',
              "return ['path'=>(string)$decoded['path'],'name'=>catalog_clean_unreal_filename((string)$decoded['filename']),'temp'=>true,'redirect'=>true,'source_extension'=>(string)$decoded['source_extension']];",
              "return ['path'=>(string)$decoded['path'],'name'=>scanner_clean_original_filename((string)$decoded['filename']),'temp'=>true,'redirect'=>true,'source_extension'=>(string)$decoded['source_extension']];"
          )

          replace_once(
              'catalog/src/Infrastructure/Jobs/CatalogStagedImportJobHandler.php',
              "$name = \\catalog_clean_unreal_filename(basename($display));",
              "$name = \\scanner_clean_original_filename(basename($display));"
          )

          replace_once(
              'catalog/lib/CatalogImport.php',
              "    if (!is_file($sourcePath)) throw new RuntimeException('Import source file missing: ' . $sourcePath);\n\n    $ext = strtolower(pathinfo($originalName, PATHINFO_EXTENSION));",
              "    if (!is_file($sourcePath)) throw new RuntimeException('Import source file missing: ' . $sourcePath);\n\n    $originalName = catalog_original_unreal_filename($originalName);\n    $ext = strtolower(pathinfo($originalName, PATHINFO_EXTENSION));"
          )

          replace_once(
              'catalog/lib/UnverifiedFileManager.php',
              '$cleanName = catalog_clean_unreal_filename($originalName);',
              '$cleanName = catalog_original_unreal_filename($originalName);'
          )

          replace_once(
              'catalog/src/Infrastructure/Import/CatalogIncomingFileStore.php',
              '''        $safeName = $this->safeName($originalName);
        $dateDirectory = $this->directory . DIRECTORY_SEPARATOR . gmdate('Ymd');''',
              '''        $logicalName = function_exists('catalog_original_unreal_filename')
            ? \\catalog_original_unreal_filename($originalName)
            : basename(str_replace(["\\0", '/', '\\\\'], ['', DIRECTORY_SEPARATOR, DIRECTORY_SEPARATOR], $originalName));
        $safeName = $this->safeName($logicalName);
        $dateDirectory = $this->directory . DIRECTORY_SEPARATOR . gmdate('Ymd');'''
          )
          replace_once(
              'catalog/src/Infrastructure/Import/CatalogIncomingFileStore.php',
              "                'original_name' => $safeName,",
              "                'original_name' => $logicalName,"
          )

          replace_once(
              'catalog/download.php',
              '''    $downloadName = catalog_clean_unreal_filename((string)$file['original_name']);
    $size = filesize($path);''',
              '''    $downloadName = catalog_original_unreal_filename((string)$file['original_name']);
    $fallbackName = catalog_clean_unreal_filename($downloadName);
    $size = filesize($path);'''
          )
          replace_once(
              'catalog/download.php',
              '''    header('Content-Disposition: attachment; filename="' . addcslashes($downloadName, "\\\"") . '"');
    header("Content-Disposition: attachment; filename*=UTF-8''" . rawurlencode($downloadName), false);''',
              '''    header('Content-Disposition: attachment; filename="' . addcslashes($fallbackName, "\\\"") . '"');
    header("Content-Disposition: attachment; filename*=UTF-8''" . rawurlencode($downloadName), false);'''
          )
          replace_once(
              'catalog/download.php',
              "catalog_h(catalog_clean_unreal_filename((string)$file['original_name']))",
              "catalog_h(catalog_original_unreal_filename((string)$file['original_name']))"
          )

          test = r'''<?php
declare(strict_types=1);

require_once __DIR__ . '/../lib/CatalogSupport.php';
require_once __DIR__ . '/../lib/CatalogScanner.php';
require_once __DIR__ . '/../lib/CatalogRedirectArchive.php';

function original_filename_expect(string $actual, string $expected, string $label): void
{
    if ($actual !== $expected) {
        throw new RuntimeException($label . ': expected [' . $expected . '] got [' . $actual . ']');
    }
}

original_filename_expect(catalog_original_unreal_filename('DM-{UEM}-OldGlory.ut2'), 'DM-{UEM}-OldGlory.ut2', 'braces preserved');
original_filename_expect(catalog_original_unreal_filename('DM-{UEM}-OldGlory (2).ut2'), 'DM-{UEM}-OldGlory.ut2', 'normal duplicate marker removed');
original_filename_expect(catalog_original_unreal_filename('DM-{UEM}-OldGlory.ut2 (2)'), 'DM-{UEM}-OldGlory.ut2', 'post-extension duplicate marker removed');
original_filename_expect(catalog_original_unreal_filename('[FF$]Soundspack1.uax (2).uz2'), '[FF$]Soundspack1.uax.uz2', 'redirect duplicate marker fixed');
original_filename_expect(catalog_redirect_archive_output_name('[FF$]Soundspack1.uax (2).uz2'), '[FF$]Soundspack1.uax', 'redirect output filename fixed');
original_filename_expect(scanner_clean_original_filename('CTF-[Clan]{Arena}+$Mix.ut2'), 'CTF-[Clan]{Arena}+$Mix.ut2', 'legacy punctuation preserved');

fwrite(STDOUT, "Original filename contract tests passed.\n");
'''
          Path('catalog/tests/original-filename-contract-test.php').write_text(test, encoding='utf-8')

          workflow = Path('.github/workflows/catalog-quality.yml')
          quality = workflow.read_text(encoding='utf-8')
          anchor = '''      - name: Test synthetic UE1-UE4 reader fixtures
        run: php catalog/tests/reader-fixtures-test.php
'''
          addition = anchor + '''      - name: Test original filename preservation
        run: php catalog/tests/original-filename-contract-test.php
'''
          if quality.count(anchor) != 1:
              raise SystemExit('catalog-quality filename test anchor changed')
          workflow.write_text(quality.replace(anchor, addition, 1), encoding='utf-8')

          sql = r'''-- UnrealDB original filename repair from ue_files.source_relative_path
-- MySQL 8.0+ / phpMyAdmin
--
-- Purpose:
--   * Restore ue_files.original_name from the final filename component of
--     source_relative_path.
--   * Preserve punctuation such as {}, [], $, + and original casing.
--   * Remove only browser/OS duplicate-copy indicators.
--   * Remove a final .uz/.uz2/.uz3 redirect suffix because ue_files stores the
--     decompressed package.
--
-- A permanent backup table is created on the first run. Re-running this script
-- does not overwrite the original backup values.

SET NAMES utf8mb4;

CREATE TABLE IF NOT EXISTS ue_original_name_backup_20260720 (
    file_id BIGINT UNSIGNED NOT NULL,
    original_name VARCHAR(255) NOT NULL,
    source_relative_path VARCHAR(1024) NULL,
    backed_up_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
    PRIMARY KEY (file_id)
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

DROP TEMPORARY TABLE IF EXISTS tmp_ue_original_name_repair;
CREATE TEMPORARY TABLE tmp_ue_original_name_repair (
    file_id BIGINT UNSIGNED NOT NULL,
    old_original_name VARCHAR(255) NOT NULL,
    source_relative_path VARCHAR(1024) NOT NULL,
    candidate VARCHAR(1024) NOT NULL,
    PRIMARY KEY (file_id)
) ENGINE=InnoDB;

INSERT INTO tmp_ue_original_name_repair
    (file_id, old_original_name, source_relative_path, candidate)
SELECT
    id,
    original_name,
    source_relative_path,
    TRIM(SUBSTRING_INDEX(REPLACE(source_relative_path, '\\', '/'), '/', -1))
FROM ue_files
WHERE source_relative_path IS NOT NULL
  AND TRIM(source_relative_path) <> '';

-- ue_files represents the decompressed package, not its redirect archive.
UPDATE tmp_ue_original_name_repair
SET candidate = CASE
    WHEN LOWER(RIGHT(candidate, 4)) IN ('.uz2', '.uz3')
        THEN LEFT(candidate, CHAR_LENGTH(candidate) - 4)
    WHEN LOWER(RIGHT(candidate, 3)) = '.uz'
        THEN LEFT(candidate, CHAR_LENGTH(candidate) - 3)
    ELSE candidate
END;

-- Name.ext (2) -> Name.ext
UPDATE tmp_ue_original_name_repair
SET candidate = REGEXP_REPLACE(candidate, '[[:space:]]+[(][0-9]+[)]$', '');

-- Name (2).ext -> Name.ext. Work on the stem so punctuation is untouched.
UPDATE tmp_ue_original_name_repair
SET candidate = CONCAT(
    REGEXP_REPLACE(
        LEFT(candidate, CHAR_LENGTH(candidate) - CHAR_LENGTH(SUBSTRING_INDEX(candidate, '.', -1)) - 1),
        '[[:space:]]+[(][0-9]+[)]$',
        ''
    ),
    '.',
    SUBSTRING_INDEX(candidate, '.', -1)
)
WHERE candidate LIKE '%.%';

-- Common filesystem copy indicators before the extension.
UPDATE tmp_ue_original_name_repair
SET candidate = CONCAT(
    REGEXP_REPLACE(
        REGEXP_REPLACE(
            LEFT(candidate, CHAR_LENGTH(candidate) - CHAR_LENGTH(SUBSTRING_INDEX(candidate, '.', -1)) - 1),
            '[[:space:]]+-[[:space:]]+copy([[:space:]]*[(][0-9]+[)])?$',
            '', 1, 0, 'i'
        ),
        '[[:space:]]+copy([[:space:]]*[(][0-9]+[)])?$',
        '', 1, 0, 'i'
    ),
    '.',
    SUBSTRING_INDEX(candidate, '.', -1)
)
WHERE candidate LIKE '%.%';

UPDATE tmp_ue_original_name_repair
SET candidate = TRIM(TRAILING '.' FROM TRIM(candidate));

-- Preview every row that will change. Review this result set before continuing.
SELECT
    r.file_id,
    f.game_id,
    r.old_original_name,
    r.candidate AS new_original_name,
    r.source_relative_path
FROM tmp_ue_original_name_repair r
JOIN ue_files f ON f.id = r.file_id
WHERE r.candidate <> ''
  AND CHAR_LENGTH(r.candidate) <= 255
  AND BINARY r.old_original_name <> BINARY r.candidate
ORDER BY f.game_id, r.candidate, r.file_id;

START TRANSACTION;

INSERT IGNORE INTO ue_original_name_backup_20260720
    (file_id, original_name, source_relative_path)
SELECT
    file_id,
    old_original_name,
    source_relative_path
FROM tmp_ue_original_name_repair
WHERE candidate <> ''
  AND CHAR_LENGTH(candidate) <= 255
  AND BINARY old_original_name <> BINARY candidate;

UPDATE ue_files f
JOIN tmp_ue_original_name_repair r ON r.file_id = f.id
SET f.original_name = r.candidate
WHERE r.candidate <> ''
  AND CHAR_LENGTH(r.candidate) <= 255
  AND BINARY f.original_name <> BINARY r.candidate;

SELECT ROW_COUNT() AS updated_ue_files_rows;

COMMIT;

-- Rows skipped because the source filename cannot fit VARCHAR(255).
SELECT file_id, old_original_name, candidate, source_relative_path
FROM tmp_ue_original_name_repair
WHERE candidate <> ''
  AND CHAR_LENGTH(candidate) > 255
ORDER BY file_id;

-- Verification sample: rows whose stored original still differs from the derived name.
SELECT
    f.id AS file_id,
    f.game_id,
    f.original_name,
    r.candidate AS expected_original_name,
    f.source_relative_path
FROM ue_files f
JOIN tmp_ue_original_name_repair r ON r.file_id = f.id
WHERE r.candidate <> ''
  AND CHAR_LENGTH(r.candidate) <= 255
  AND BINARY f.original_name <> BINARY r.candidate
ORDER BY f.id;

-- Rollback helper (run separately only when required):
-- UPDATE ue_files f
-- JOIN ue_original_name_backup_20260720 b ON b.file_id=f.id
-- SET f.original_name=b.original_name;
'''
          Path('catalog/upgrade-original-filenames-from-source-path.sql').write_text(sql, encoding='utf-8')
          PY
      - name: Validate changes
        run: |
          php -l catalog/lib/CatalogSupportCore.php
          php -l catalog/lib/CatalogScanner.php
          php -l catalog/lib/CatalogRedirectArchive.php
          php -l catalog/source-scan.php
          php -l catalog/src/Infrastructure/Jobs/CatalogStagedImportJobHandler.php
          php -l catalog/lib/CatalogImport.php
          php -l catalog/lib/UnverifiedFileManager.php
          php -l catalog/src/Infrastructure/Import/CatalogIncomingFileStore.php
          php -l catalog/download.php
          php -l catalog/tests/original-filename-contract-test.php
          php catalog/tests/original-filename-contract-test.php
          php catalog/tests/review-completion-contract-test.php
      - name: Commit actual fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/one-time-preserve-original-filenames.yml
          git add -A
          git commit -m "fix: preserve source filenames during import"
          git push origin HEAD:main
