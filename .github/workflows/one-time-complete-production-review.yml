name: One-time complete production review

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, mbstring, openssl, zip
          coverage: none
      - name: Apply guarded production changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          scanner = Path('catalog/lib/CatalogScanner.php')
          text = scanner.read_text()
          old = '''function scanner_source_path_schema_ensure(PDO $db): void
          {
              static $done = false;
              if ($done) {
                  return;
              }

              $exists = catalog_one(
                  $db,
                  'SELECT COUNT(*) c FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND COLUMN_NAME="source_relative_path"'
              );
              if ((int)($exists['c'] ?? 0) === 0) {
                  $db->exec('ALTER TABLE ue_files ADD COLUMN source_relative_path VARCHAR(1024) NULL DEFAULT NULL AFTER original_name');
              }

              $done = true;
          }
          '''
          new = '''function scanner_source_path_schema_ensure(PDO $db): void
          {
              static $verified = false;
              if ($verified) {
                  return;
              }

              $exists = catalog_one(
                  $db,
                  'SELECT COUNT(*) c FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND COLUMN_NAME="source_relative_path"'
              );
              if ((int)($exists['c'] ?? 0) === 0) {
                  throw new RuntimeException(
                      'The database schema is not migrated. Missing: ue_files.source_relative_path. '
                      . 'Run php catalog/bin/migrate.php migrate followed by verify.'
                  );
              }

              $verified = true;
          }
          '''
          if old not in text:
              raise SystemExit('CatalogScanner source schema block drifted')
          scanner.write_text(text.replace(old, new, 1))

          unverified = Path('catalog/lib/CatalogUnverifiedIndex.php')
          text = unverified.read_text()
          start = text.index('function catalog_unverified_schema_ensure(PDO $db): void')
          end = text.index('\nfunction catalog_unverified_queue_key', start)
          replacement = '''function catalog_unverified_schema_ensure(PDO $db): void
          {
              static $verified = false;
              if ($verified) {
                  return;
              }

              $missing = [];
              $gameId = catalog_one($db, 'SELECT IS_NULLABLE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND COLUMN_NAME="game_id"');
              if (!$gameId || strtoupper((string)$gameId['IS_NULLABLE']) !== 'YES') {
                  $missing[] = 'ue_files.game_id nullable';
              }
              $status = catalog_one($db, 'SELECT COLUMN_TYPE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND COLUMN_NAME="scan_status"');
              if (!$status || !str_contains(strtolower((string)$status['COLUMN_TYPE']), "'unverified'")) {
                  $missing[] = 'ue_files.scan_status unverified value';
              }
              foreach (['source_relative_path', 'unverified_queue_key', 'unverified_queue_game_id', 'unverified_queue_name', 'unverified_reason'] as $column) {
                  $exists = catalog_one($db, 'SELECT COUNT(*) c FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND COLUMN_NAME=?', [$column]);
                  if ((int)($exists['c'] ?? 0) === 0) {
                      $missing[] = 'ue_files.' . $column;
                  }
              }
              foreach (['uq_ue_files_unverified_queue_key', 'idx_ue_files_scan_status', 'idx_ue_files_unverified_queue'] as $index) {
                  $exists = catalog_one($db, 'SELECT COUNT(*) c FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND INDEX_NAME=?', [$index]);
                  if ((int)($exists['c'] ?? 0) === 0) {
                      $missing[] = 'index ' . $index;
                  }
              }
              if ($missing !== []) {
                  throw new RuntimeException(
                      'The database schema is not migrated. Missing: ' . implode(', ', $missing)
                      . '. Run php catalog/bin/migrate.php migrate followed by verify.'
                  );
              }

              scanner_source_path_schema_ensure($db);
              $verified = true;
          }
          '''
          unverified.write_text(text[:start] + replacement + text[end:])

          changed = []
          raw_block = re.compile(
              r'(?m)^session_start\(\);\s*\n(?:error_reporting\(E_ALL\);\s*\n)?(?:ini_set\([\'\"]display_errors[\'\"],\s*[\'\"]1[\'\"]\);\s*\n)?(?:ini_set\([\'\"]display_startup_errors[\'\"],\s*[\'\"]1[\'\"]\);\s*\n)?'
          )
          display_lines = re.compile(r'(?m)^(?:error_reporting\(E_ALL\);|ini_set\([\'\"]display_(?:startup_)?errors[\'\"],\s*[\'\"]1[\'\"]\);)\s*\n')
          for path in sorted(Path('catalog').rglob('*.php')):
              rel = path.as_posix()
              if '/tests/' in rel or '/migrations/' in rel or '/src/' in rel or '/lib/' in rel or '/parsers/' in rel or rel.startswith('catalog/bin/'):
                  continue
              original = path.read_text()
              head = original[:1200]
              if 'session_start();' not in head and 'display_errors' not in head and 'display_startup_errors' not in head:
                  continue
              updated = raw_block.sub('', original, count=1)
              updated = display_lines.sub('', updated)
              if 'session_start();' in head and 'catalog_start_session();' not in updated[:1800]:
                  match = re.search(r'(?m)^require_once\s+[^;]*CatalogSupport\.php[^;]*;\s*$', updated)
                  if match:
                      updated = updated[:match.end()] + '\n\ncatalog_start_session();' + updated[match.end():]
                  elif "require_once dirname(__DIR__) . '/bootstrap.php';" in updated:
                      marker = "require_once dirname(__DIR__) . '/bootstrap.php';"
                      updated = updated.replace(marker, marker + '\n\ncatalog_start_session();', 1)
                  else:
                      raise SystemExit(f'Cannot place shared session bootstrap in {rel}')
              if updated != original:
                  path.write_text(updated)
                  changed.append(rel)
          print('Controller bootstrap updates:', len(changed))
          for rel in changed:
              print(' -', rel)
          PY
      - name: Add runtime-schema and bootstrap contract
        run: |
          cat > catalog/tests/production-review-completion-test.php <<'PHP'
          <?php
          declare(strict_types=1);

          function review_expect(bool $condition, string $message): void
          {
              if (!$condition) {
                  throw new RuntimeException($message);
              }
          }

          $scanner = (string)file_get_contents(__DIR__ . '/../lib/CatalogScanner.php');
          $unverified = (string)file_get_contents(__DIR__ . '/../lib/CatalogUnverifiedIndex.php');
          review_expect(!str_contains($scanner, "exec('ALTER TABLE ue_files"), 'Scanner must not mutate schema at runtime.');
          review_expect(!str_contains($unverified, "exec('ALTER TABLE ue_files"), 'Unverified indexing must not mutate schema at runtime.');
          review_expect(str_contains($scanner, 'Run php catalog/bin/migrate.php migrate followed by verify.'), 'Scanner must report migration remediation.');
          review_expect(str_contains($unverified, 'Run php catalog/bin/migrate.php migrate followed by verify.'), 'Unverified indexing must report migration remediation.');

          $iterator = new RecursiveIteratorIterator(new RecursiveDirectoryIterator(dirname(__DIR__), FilesystemIterator::SKIP_DOTS));
          foreach ($iterator as $file) {
              if (!$file instanceof SplFileInfo || !$file->isFile() || strtolower($file->getExtension()) !== 'php') {
                  continue;
              }
              $path = str_replace('\\', '/', $file->getPathname());
              if (str_contains($path, '/tests/') || str_contains($path, '/migrations/') || str_contains($path, '/src/') || str_contains($path, '/lib/') || str_contains($path, '/parsers/') || str_contains($path, '/bin/')) {
                  continue;
              }
              $head = substr((string)file_get_contents($file->getPathname()), 0, 1800);
              review_expect(!str_contains($head, "ini_set('display_errors', '1')") && !str_contains($head, 'ini_set("display_errors", "1")'), $path . ': enables display_errors.');
              review_expect(!str_contains($head, 'display_startup_errors'), $path . ': enables display_startup_errors.');
              review_expect(!str_contains($head, 'session_start();'), $path . ': uses raw session_start().');
          }

          fwrite(STDOUT, "Production review completion contracts passed.\n");
          PHP
      - name: Register completion contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/catalog-quality.yml')
          text = path.read_text()
          marker = "      - name: Test synthetic UE1-UE4 reader fixtures\n        run: php catalog/tests/reader-fixtures-test.php\n"
          addition = marker + "      - name: Verify production review completion boundaries\n        run: php catalog/tests/production-review-completion-test.php\n"
          if marker not in text:
              raise SystemExit('Catalog quality marker drifted')
          path.write_text(text.replace(marker, addition, 1))
          PY
      - name: Validate transformed tree
        run: |
          find catalog -type f -name '*.php' -not -path 'catalog/vendor/*' -print0 | xargs -0 -n1 php -l
          php catalog/tests/production-review-completion-test.php
          php catalog/tests/reader-fixtures-test.php
          php catalog/tests/architecture-boundaries-test.php
          php catalog/tests/security-boundaries-test.php
      - name: Commit completion pass
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-time-complete-production-review.yml
          git add catalog .github/workflows/catalog-quality.yml
          git commit -m 'security: complete runtime schema and bootstrap cleanup'
          git push origin HEAD:main
