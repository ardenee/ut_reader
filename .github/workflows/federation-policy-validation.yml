name: Federation policy validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, mbstring, openssl, sodium, zip
          coverage: none
      - name: PHP syntax
        run: |
          failed=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if ! output=$(php -l "$file" 2>&1); then
              echo "--- $file"
              echo "$output"
              failed=1
            fi
          done < <(git diff --name-only --diff-filter=ACM origin/main...HEAD -- '*.php')
          exit "$failed"
      - name: Run federation contracts
        id: contracts
        continue-on-error: true
        run: |
          mkdir -p validation-results
          failed=0
          for test in \
            catalog/tests/federation-base-game-policy-contract-test.php \
            catalog/tests/federation-role-workflow-contract-test.php \
            catalog/tests/federation-inventory-selection-contract-test.php; do
            name=$(basename "$test" .php)
            if php "$test" >"validation-results/${name}.log" 2>&1; then
              echo "$test: passed"
            else
              echo "$test: failed"
              failed=1
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Upload contract outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federation-contract-results
          path: validation-results
          if-no-files-found: error
          retention-days: 1
      - name: Fail on contract errors
        if: steps.contracts.outputs.failed != '0'
        run: |
          cat validation-results/*.log
          exit 1
