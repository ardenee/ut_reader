name: One-time final runtime cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, mbstring, openssl, zip
          coverage: none
      - name: Remove runtime DDL and raw controller bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_function_block(path: Path, name: str, next_name: str, replacement: str) -> None:
              text = path.read_text()
              pattern = re.compile(
                  rf'function {re.escape(name)}\(PDO \$db\): void\n\{{.*?\n\}}\n\nfunction {re.escape(next_name)}',
                  re.S,
              )
              updated, count = pattern.subn(replacement + '\n\nfunction ' + next_name, text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: schema function block drifted')
              path.write_text(updated)

          replace_function_block(
              Path('catalog/lib/CatalogScanner.php'),
              'scanner_source_path_schema_ensure',
              'scanner_record_source_relative_path',
              '''function scanner_source_path_schema_ensure(PDO $db): void
          {
              static $verified = false;
              if ($verified) {
                  return;
              }

              $exists = catalog_one(
                  $db,
                  'SELECT COUNT(*) c FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND COLUMN_NAME="source_relative_path"'
              );
              if ((int)($exists['c'] ?? 0) === 0) {
                  throw new RuntimeException(
                      'The database schema is not migrated. Missing: ue_files.source_relative_path. '
                      . 'Run php catalog/bin/migrate.php migrate followed by verify.'
                  );
              }

              $verified = true;
          }''',
          )

          replace_function_block(
              Path('catalog/lib/CatalogUnverifiedIndex.php'),
              'catalog_unverified_schema_ensure',
              'catalog_unverified_queue_key',
              '''function catalog_unverified_schema_ensure(PDO $db): void
          {
              static $verified = false;
              if ($verified) {
                  return;
              }

              $missing = [];
              $gameId = catalog_one($db, 'SELECT IS_NULLABLE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND COLUMN_NAME="game_id"');
              if (!$gameId || strtoupper((string)$gameId['IS_NULLABLE']) !== 'YES') {
                  $missing[] = 'ue_files.game_id nullable';
              }
              $status = catalog_one($db, 'SELECT COLUMN_TYPE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND COLUMN_NAME="scan_status"');
              if (!$status || !str_contains(strtolower((string)$status['COLUMN_TYPE']), "'unverified'")) {
                  $missing[] = 'ue_files.scan_status unverified value';
              }
              foreach (['source_relative_path', 'unverified_queue_key', 'unverified_queue_game_id', 'unverified_queue_name', 'unverified_reason'] as $column) {
                  $exists = catalog_one($db, 'SELECT COUNT(*) c FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND COLUMN_NAME=?', [$column]);
                  if ((int)($exists['c'] ?? 0) === 0) {
                      $missing[] = 'ue_files.' . $column;
                  }
              }
              foreach (['uq_ue_files_unverified_queue_key', 'idx_ue_files_scan_status', 'idx_ue_files_unverified_queue'] as $index) {
                  $exists = catalog_one($db, 'SELECT COUNT(*) c FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND INDEX_NAME=?', [$index]);
                  if ((int)($exists['c'] ?? 0) === 0) {
                      $missing[] = 'index ' . $index;
                  }
              }
              if ($missing !== []) {
                  throw new RuntimeException(
                      'The database schema is not migrated. Missing: ' . implode(', ', $missing)
                      . '. Run php catalog/bin/migrate.php migrate followed by verify.'
                  );
              }

              scanner_source_path_schema_ensure($db);
              $verified = true;
          }''',
          )

          display = re.compile(
              r'(?m)^[ \t]*(?:error_reporting\(E_ALL\);|ini_set\([\'\"]display_(?:startup_)?errors[\'\"],\s*[\'\"]1[\'\"]\);)[ \t]*\n'
          )
          raw_session = re.compile(r'(?m)^[ \t]*session_start\(\);[ \t]*\n')
          support = re.compile(r'(?m)^require_once\s+[^;]*CatalogSupport\.php[^;]*;[ \t]*$')

          changed = []
          skipped = []
          for file in sorted(Path('catalog').rglob('*.php')):
              rel = file.as_posix()
              if any(part in rel for part in ['/tests/', '/migrations/', '/src/', '/lib/', '/parsers/', '/bin/', '/bootstrap/']):
                  continue
              original = file.read_text()
              head = original[:1800]
              if 'session_start();' not in head and 'display_errors' not in head and 'display_startup_errors' not in head and 'error_reporting(E_ALL);' not in head:
                  continue

              updated = display.sub('', original)
              if 'session_start();' in head:
                  match = support.search(updated)
                  if match is None:
                      skipped.append(rel)
                      continue
                  updated = raw_session.sub('', updated)
                  if 'catalog_start_session();' not in updated[:2400]:
                      match = support.search(updated)
                      updated = updated[:match.end()] + '\n\ncatalog_start_session();' + updated[match.end():]

              if updated != original:
                  file.write_text(updated)
                  changed.append(rel)

          print('Updated controllers:', len(changed))
          for rel in changed:
              print('UPDATED', rel)
          for rel in skipped:
              print('SKIPPED_NONSTANDARD_BOOTSTRAP', rel)
          PY
      - name: Validate changed PHP and completion contracts
        run: |
          changed_php="$(git diff --name-only -- '*.php')"
          if [ -n "$changed_php" ]; then
            while IFS= read -r file; do php -l "$file"; done <<< "$changed_php"
          fi
          php catalog/tests/review-completion-contract-test.php
          php catalog/tests/security-boundaries-test.php
          php catalog/tests/architecture-boundaries-test.php
          ! grep -n 'ALTER TABLE' catalog/lib/CatalogScanner.php catalog/lib/CatalogUnverifiedIndex.php
      - name: Commit completed cleanup and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-time-final-runtime-cleanup.yml
          git add catalog
          git commit -m 'security: finish runtime bootstrap cleanup'
          git pull --rebase origin main
          git push origin HEAD:main
