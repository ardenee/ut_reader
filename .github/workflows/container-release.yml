name: Container release

on:
  pull_request:
    paths:
      - Dockerfile
      - compose.yaml
      - .dockerignore
      - catalog/**
      - deploy/**
      - .github/workflows/container-release.yml
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - Dockerfile
      - compose.yaml
      - .dockerignore
      - catalog/**
      - deploy/**
      - .github/workflows/container-release.yml
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  validate-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-kubectl@v4
        with:
          version: latest
      - name: Validate shell entrypoints
        run: sh -n deploy/docker/entrypoint.sh deploy/docker/worker-loop.sh
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize deploy/kubernetes/base > /tmp/unrealdb-platform.yaml
          kubectl apply --dry-run=client --validate=false -f /tmp/unrealdb-platform.yaml
          kubectl apply --dry-run=client --validate=false -f deploy/kubernetes/optional/web-scaling.yaml
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: unrealdb-ci:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify Apache configuration
        run: docker run --rm unrealdb-ci:${{ github.sha }} apache2ctl -t
      - name: Verify deployment PHP syntax
        run: |
          docker run --rm --entrypoint php unrealdb-ci:${{ github.sha }} -l /var/www/html/catalog/api/v1/live.php
          docker run --rm --entrypoint php unrealdb-ci:${{ github.sha }} -l /var/www/html/deploy/docker/config.php
      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@v6
        id: scan
        with:
          image: unrealdb-ci:${{ github.sha }}
          severity-cutoff: high
          fail-build: true
          output-format: sarif
      - name: Upload vulnerability report
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  publish-image:
    if: github.event_name != 'pull_request'
    needs: validate-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record release digest
        run: echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
