name: Container release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  validate-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.36.3
      - name: Validate shell entrypoints
        run: sh -n deploy/docker/entrypoint.sh deploy/docker/worker-loop.sh
      - name: Validate Compose configuration
        env:
          UNREALDB_DB_PASSWORD: ci-database-password
          UNREALDB_DB_ROOT_PASSWORD: ci-root-password
        run: docker compose config --quiet
      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize deploy/kubernetes/base > /tmp/unrealdb-platform.yaml
          kubectl apply --dry-run=client --validate=false -f /tmp/unrealdb-platform.yaml
          kubectl apply --dry-run=client --validate=false -f deploy/kubernetes/optional/web-scaling.yaml
      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: unrealdb-ci:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify Apache configuration
        run: docker run --rm unrealdb-ci:${{ github.sha }} apache2ctl -t
      - name: Verify deployment PHP syntax
        run: |
          docker run --rm --entrypoint php unrealdb-ci:${{ github.sha }} -l /var/www/html/catalog/api/v1/live.php
          docker run --rm --entrypoint php unrealdb-ci:${{ github.sha }} -l /var/www/html/deploy/docker/config.php
      - name: Verify security hardening contracts
        run: docker run --rm -v "$PWD:/workspace:ro" -w /workspace --entrypoint php unrealdb-ci:${{ github.sha }} catalog/bin/verify-security-hardening.php
      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        id: scan
        with:
          image: unrealdb-ci:${{ github.sha }}
          severity-cutoff: high
          fail-build: true
          output-format: sarif
      - name: Upload vulnerability report
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  publish-image:
    if: github.event_name != 'pull_request'
    needs: validate-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Attest image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record release digest
        run: echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
