name: Detached worker quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detached-worker-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Syntax check detached worker PHP
        run: |
          php -l catalog/lib/CatalogRedirectArchivePayload.php
          php -l catalog/lib/CatalogSourceScan.php
          php -l catalog/lib/CatalogSourceScanNoContainers.php
          php -l catalog/src/Infrastructure/Import/CatalogChunkedUploadStore.php
          php -l catalog/src/Infrastructure/Import/CatalogIncomingFileStore.php
          php -l catalog/src/Infrastructure/Import/CatalogProfiledUploadQueue.php
          php -l catalog/src/Infrastructure/Jobs/CatalogDetachedWorker.php
          php -l catalog/src/Infrastructure/Jobs/CatalogNonBlockingImportJobHandler.php
          php -l catalog/src/Infrastructure/Jobs/CatalogPakImportJobHandler.php
          php -l catalog/src/Infrastructure/Jobs/CatalogSourceScanJobHandler.php
          php -l catalog/src/Infrastructure/Jobs/CatalogBackgroundJobCleanup.php
          php -l catalog/src/Infrastructure/Jobs/CatalogJobWorkerFactory.php
          php -l catalog/src/Infrastructure/Jobs/GameBackupExportJobHandler.php
          php -l catalog/src/Infrastructure/Jobs/GameBackupJobHandler.php
          php -l catalog/src/Infrastructure/Storage/CatalogPakArchiveStore.php
          php -l catalog/src/Infrastructure/Storage/GameBackupStore.php
          php -l catalog/src/Presentation/Ui/CatalogUi.php
          php -l catalog/migrations/202607210001_pak_archive_management.php
          php -l catalog/bin/catalog-worker-detached.php
          php -l catalog/api/v1/_bootstrap.php
          php -l catalog/api/v1/job-run.php
          php -l catalog/api/v1/job-status.php
          php -l catalog/api/v1/job-action.php
          php -l catalog/api/v1/job-worker-status.php
          php -l catalog/api/v1/job-worker-action.php
          php -l catalog/api/v1/profiled-upload-chunk.php
          php -l catalog/background-jobs.php
          php -l catalog/profiled-upload.php
          php -l catalog/pak-import.php
          php -l catalog/paks.php
          php -l catalog/game-paks.php
          php -l catalog/pak-info.php
          php -l catalog/pak-download.php
          php -l catalog/pak-maintenance.php
          php -l catalog/file-pak-sources.php
          php -l catalog/game-backups.php
          php -l catalog/dashboard.php
          php -l catalog/tests/detached-worker-contract-test.php
          php -l catalog/tests/background-job-controls-contract-test.php
          php -l catalog/tests/game-backup-contract-test.php
          php -l catalog/tests/pak-archive-management-contract-test.php
          php -l catalog/tests/chunked-pak-upload-contract-test.php
          php -l tests/catalog_redirect_payload_test.php
      - name: Syntax check detached worker clients
        run: |
          node --check catalog/assets/background-jobs.js
          node --check catalog/assets/profiled-upload-jobs.js
          node --check catalog/assets/pak-import-jobs.js
          node --check catalog/assets/file-dependency-display.js
      - name: Verify detached worker contract
        run: php catalog/tests/detached-worker-contract-test.php
      - name: Verify background job controls contract
        run: php catalog/tests/background-job-controls-contract-test.php
      - name: Verify game backup contract
        run: php catalog/tests/game-backup-contract-test.php
      - name: Verify PAK archive management contract
        run: php catalog/tests/pak-archive-management-contract-test.php
      - name: Verify chunked PAK upload contract
        run: php catalog/tests/chunked-pak-upload-contract-test.php
      - name: Verify generic redirect payload decoding
        run: php tests/catalog_redirect_payload_test.php
