name: Apply unverified staging integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-unverified-staging.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Integrate database-backed unverified staging
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_all(path, old, new, expected):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def sub_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: regex replacement did not match exactly once')
              p.write_text(updated, encoding='utf-8')

          scanner_function = r'''function scanner_store_failed_upload(array $config, string $tmp, string $originalName, string $gameSlug, string $reason, string $sourceRelativePath = ''): void
          {
              if (!is_file($tmp)) {
                  return;
              }
              if (!scanner_file_has_unreal_package_magic($tmp)) {
                  @unlink($tmp);
                  return;
              }

              $slug = scanner_slug_text($gameSlug);
              $dir = rtrim((string)$config['storage_path'], DIRECTORY_SEPARATOR) . '/games/' . $slug . '/unverified';
              if (!is_dir($dir) && !@mkdir($dir, 0775, true) && !is_dir($dir)) {
                  error_log('[UnrealDB unverified] Could not create queue folder: ' . $dir);
                  @unlink($tmp);
                  return;
              }

              $cleanName = scanner_clean_original_filename($originalName);
              $name = date('Ymd_His') . '_' . bin2hex(random_bytes(4)) . '_' . preg_replace('/[^A-Za-z0-9._ +\-]+/', '_', basename($cleanName));
              $destination = $dir . '/' . $name;
              if (!@rename($tmp, $destination)) {
                  error_log('[UnrealDB unverified] Could not move failed package into queue: ' . $destination);
                  @unlink($tmp);
                  return;
              }
              @file_put_contents($destination . '.txt', $reason);

              try {
                  require_once __DIR__ . '/CatalogUnverifiedIndex.php';
                  $db = catalog_db($config);
                  $game = catalog_one($db, 'SELECT id FROM ue_games WHERE slug=? LIMIT 1', [$slug]);
                  if (!$game) {
                      throw new RuntimeException('The queue game could not be resolved from slug ' . $slug . '.');
                  }
                  $userId = isset($_SESSION['user']['id']) ? (int)$_SESSION['user']['id'] : null;
                  catalog_unverified_index_path(
                      $db,
                      $config,
                      (int)$game['id'],
                      $name,
                      $destination,
                      $cleanName,
                      $reason,
                      $userId,
                      $sourceRelativePath,
                      false
                  );
              } catch (Throwable $error) {
                  error_log('[UnrealDB unverified] Immediate database staging failed for ' . $cleanName . ': ' . $error->getMessage());
                  @file_put_contents($destination . '.txt', "\nDatabase staging failed: " . $error->getMessage(), FILE_APPEND);
              }
          }

          function scanner_profile_extensions'''
          sub_once(
              'catalog/lib/CatalogScanner.php',
              r'function scanner_store_failed_upload\(array \$config, string \$tmp, string \$originalName, string \$gameSlug, string \$reason\): void\n\{.*?\n\}\n\nfunction scanner_profile_extensions',
              scanner_function,
          )

          bucket_function = r'''function uvf_store_bucket_upload(array $config, string $tmp, string $originalName, string $reason): array
          {
              if (!is_file($tmp)) {
                  throw new RuntimeException('Upload temporary file is missing.');
              }

              $dir = uvf_upload_bucket_dir($config, true);
              $cleanName = catalog_clean_unreal_filename($originalName);
              $queueName = uvf_safe_queue_name($cleanName);
              $destination = uvf_unique_destination($dir, $queueName);

              if (is_uploaded_file($tmp)) {
                  $moved = @move_uploaded_file($tmp, $destination);
              } else {
                  $moved = @rename($tmp, $destination);
              }
              if (!$moved) {
                  throw new RuntimeException('Could not move uploaded file into the upload bucket.');
              }

              @file_put_contents($destination . '.txt', $reason);
              try {
                  require_once __DIR__ . '/CatalogUnverifiedIndex.php';
                  $db = catalog_db($config);
                  $userId = isset($_SESSION['user']['id']) ? (int)$_SESSION['user']['id'] : null;
                  $indexed = catalog_unverified_index_path($db, $config, 0, basename($destination), $destination, $cleanName, $reason, $userId);
              } catch (Throwable $error) {
                  @unlink($destination);
                  @unlink($destination . '.txt');
                  throw new RuntimeException('The upload could not be added to unverified database staging: ' . $error->getMessage(), 0, $error);
              }

              return [
                  'queue_name' => basename($destination),
                  'original_name' => $cleanName,
                  'size' => (int)(filesize($destination) ?: 0),
                  'path' => $destination,
                  'file_id' => (int)$indexed['file_id'],
              ];
          }

          /**
           * Extract metadata'''
          sub_once(
              'catalog/lib/UnverifiedFileManager.php',
              r'function uvf_store_bucket_upload\(array \$config, string \$tmp, string \$originalName, string \$reason\): array\n\{.*?\n\}\n\n/\*\*\n \* Extract metadata',
              bucket_function,
          )

          replace_once(
              'catalog/profiled-upload.php',
              "scanner_store_failed_upload($config, $scanTmp, $scanName, $gameSlug, $innerError->getMessage());",
              "scanner_store_failed_upload($config, $scanTmp, $scanName, $gameSlug, $innerError->getMessage(), $display);",
          )
          replace_once(
              'catalog/profiled-upload.php',
              "scanner_store_failed_upload($config, $scanTmp, $scanName, (string)$game['slug'], $e->getMessage());",
              "scanner_store_failed_upload($config, $scanTmp, $scanName, (string)$game['slug'], $e->getMessage(), (string)($scanRelativePath ?? ''));",
          )
          replace_once(
              'catalog/profiled-upload.php',
              "scanner_store_failed_upload($config, (string)$tmp, $displayName, (string)$game['slug'], $e->getMessage());",
              "scanner_store_failed_upload($config, (string)$tmp, $displayName, (string)$game['slug'], $e->getMessage(), $sourceRelativePath);",
          )

          replace_once(
              'catalog/pak-import.php',
              """                if (is_file((string)$file['path'])) {
                              @unlink((string)$file['path']);
                          }""",
              """                if (is_file((string)$file['path'])) {
                              scanner_store_failed_upload(
                                  $config,
                                  (string)$file['path'],
                                  basename($display),
                                  (string)$game['slug'],
                                  'PAK entry ' . $display . ': ' . $error->getMessage(),
                                  $display
                              );
                          }""",
          )

          source_helper = r'''function source_scan_queue_failed(array $config, array $source, array $work, string $relative, Throwable $error): void
          {
              try {
                  $tmp = source_scan_tmp_copy((string)$work['path']);
                  scanner_store_failed_upload(
                      $config,
                      $tmp,
                      (string)$work['name'],
                      (string)$source['game_slug'],
                      'Local Source Scan import failed for ' . $relative . ': ' . $error->getMessage(),
                      source_scan_scanner_relative_path($relative, $work)
                  );
              } catch (Throwable $queueError) {
                  error_log('[UnrealDB source scan] Could not queue failed package ' . $relative . ': ' . $queueError->getMessage());
              }
          }

          function source_scan_record_import_result'''
          replace_once(
              'catalog/source-scan.php',
              'function source_scan_record_import_result',
              source_helper,
          )
          replace_all(
              'catalog/source-scan.php',
              "                        $importFailed++;\n",
              "                        $importFailed++;\n                        source_scan_queue_failed($config, $source, $work, $relative, $scanError);\n",
              3,
          )

          replace_once(
              'catalog/game-files.php',
              "$where = 'WHERE f.game_id=?';",
              "$where = 'WHERE f.game_id=? AND f.scan_status=\"verified\"';",
          )

          replace_once(
              'catalog/file-examine.php',
              "$file = catalog_one($db, 'SELECT f.*, g.name game_name, g.id game_id FROM ue_files f JOIN ue_games g ON g.id=f.game_id WHERE f.id=?', [$id]);",
              "$file = catalog_one($db, 'SELECT f.*, COALESCE(g.name,\"Unverified staging\") game_name, g.id game_id FROM ue_files f LEFT JOIN ue_games g ON g.id=f.game_id WHERE f.id=?', [$id]);",
          )
          replace_once(
              'catalog/file-examine.php',
              "$back = ex_back((int)$file['game_id']);",
              "$back = (string)$file['scan_status'] === 'unverified' ? 'unverified-files.php' : ex_back((int)$file['game_id']);",
          )
          replace_once(
              'catalog/file-info.php',
              "$file = catalog_one($db, 'SELECT f.*, g.name game_name FROM ue_files f JOIN ue_games g ON g.id=f.game_id WHERE f.id=?', [$id]);",
              "$file = catalog_one($db, 'SELECT f.*, COALESCE(g.name,\"Unverified staging\") game_name FROM ue_files f LEFT JOIN ue_games g ON g.id=f.game_id WHERE f.id=?', [$id]);",
          )
          replace_once(
              'catalog/file-info.php',
              "$gameHref = 'game-files.php?id=' . (int)$file['game_id'];",
              "$gameHref = (string)$file['scan_status'] === 'unverified' ? 'unverified-files.php' : 'game-files.php?id=' . (int)$file['game_id'];",
          )

          replace_once(
              'catalog/upload-bucket.php',
              'No game, ue_files row, names, imports, exports, or dependencies are created here.',
              'Each accepted package is immediately added to ue_files as unverified and its readable Names, Imports and Exports are stored. It remains outside every game until promoted.',
          )
          replace_once(
              'catalog/upload-bucket.php',
              'Upload unsorted Unreal package files into a neutral bucket. You can select individual files or a whole folder/subfolders. Redirect-compressed .uz/.uz2/.uz3 uploads are decompressed first and only the real package is retained.',
              'Upload unsorted Unreal package files into database-backed unverified staging. You can select individual files or a whole folder/subfolders. Redirect-compressed .uz/.uz2/.uz3 uploads are decompressed first and only the real package is retained.',
          )

          replace_once(
              'catalog/lib/CatalogUnverifiedIndex.php',
              "$guid = trim((string)($header['guid'] ?? ''));",
              "$guid = trim(catalog_header_guid($header));",
          )

          install = Path('catalog/install.sql')
          text = install.read_text(encoding='utf-8')
          start = text.index('CREATE TABLE ue_files (')
          end = text.index(') ENGINE=InnoDB', start)
          block = text[start:end]
          block = block.replace('  game_id INT UNSIGNED NOT NULL,', '  game_id INT UNSIGNED NULL,', 1)
          if 'source_relative_path VARCHAR(1024)' not in block:
              block = block.replace('  original_name VARCHAR(255) NOT NULL,', '  original_name VARCHAR(255) NOT NULL,\n  source_relative_path VARCHAR(1024) NULL,', 1)
          block = block.replace("scan_status ENUM('verified','duplicate','failed') NOT NULL DEFAULT 'verified',", "scan_status ENUM('verified','unverified','duplicate','failed') NOT NULL DEFAULT 'verified',", 1)
          if 'unverified_queue_key' not in block:
              block = block.replace(
                  "  scan_status ENUM('verified','unverified','duplicate','failed') NOT NULL DEFAULT 'verified',",
                  "  scan_status ENUM('verified','unverified','duplicate','failed') NOT NULL DEFAULT 'verified',\n  unverified_queue_key CHAR(64) NULL,\n  unverified_queue_game_id INT UNSIGNED NULL,\n  unverified_queue_name VARCHAR(255) NULL,\n  unverified_reason TEXT NULL,",
                  1,
              )
              block = block.replace(
                  '  KEY idx_ue_files_sha1_global (sha1),',
                  '  KEY idx_ue_files_sha1_global (sha1),\n  UNIQUE KEY uq_ue_files_unverified_queue_key (unverified_queue_key),\n  KEY idx_ue_files_scan_status (scan_status),\n  KEY idx_ue_files_unverified_queue (unverified_queue_game_id, unverified_queue_name),',
                  1,
              )
          install.write_text(text[:start] + block + text[end:], encoding='utf-8')

          Path('catalog/upgrade-unverified-index.sql').write_text('''-- Database-backed unverified staging\n-- Safe to run once on an existing UnrealDB catalogue. The application also\n-- performs these checks automatically when the unverified tools are opened.\n\nALTER TABLE ue_files MODIFY game_id INT UNSIGNED NULL;\nALTER TABLE ue_files MODIFY scan_status ENUM('verified','unverified','duplicate','failed') NOT NULL DEFAULT 'verified';\nALTER TABLE ue_files ADD COLUMN IF NOT EXISTS source_relative_path VARCHAR(1024) NULL AFTER original_name;\nALTER TABLE ue_files ADD COLUMN IF NOT EXISTS unverified_queue_key CHAR(64) NULL AFTER scan_status;\nALTER TABLE ue_files ADD COLUMN IF NOT EXISTS unverified_queue_game_id INT UNSIGNED NULL AFTER unverified_queue_key;\nALTER TABLE ue_files ADD COLUMN IF NOT EXISTS unverified_queue_name VARCHAR(255) NULL AFTER unverified_queue_game_id;\nALTER TABLE ue_files ADD COLUMN IF NOT EXISTS unverified_reason TEXT NULL AFTER unverified_queue_name;\nALTER TABLE ue_files ADD UNIQUE KEY IF NOT EXISTS uq_ue_files_unverified_queue_key (unverified_queue_key);\nALTER TABLE ue_files ADD KEY IF NOT EXISTS idx_ue_files_scan_status (scan_status);\nALTER TABLE ue_files ADD KEY IF NOT EXISTS idx_ue_files_unverified_queue (unverified_queue_game_id, unverified_queue_name);\n''', encoding='utf-8')

          Path('.github/workflows/apply-unverified-staging.yml').unlink()
          PY

      - name: Validate PHP
        run: |
          php -l catalog/lib/CatalogScanner.php
          php -l catalog/lib/UnverifiedFileManager.php
          php -l catalog/lib/CatalogUnverifiedIndex.php
          php -l catalog/profiled-upload.php
          php -l catalog/upload-bucket.php
          php -l catalog/pak-import.php
          php -l catalog/source-scan.php
          php -l catalog/game-files.php
          php -l catalog/file-examine.php
          php -l catalog/file-info.php
          php -l catalog/unverified-files.php
          php -l catalog/unverified-files-action.php
          php -l catalog/unverified-database-import.php
          php -l catalog/unverified-database-import-action.php

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: index unverified files during ingestion"
          git push origin HEAD:main
