name: One-time source-truth identity fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-source-truth-identity-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source-truth package identity fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # CatalogScanner.php: central source-of-truth identity derivation and
          # canonical database rewrite for primary package, exports and aliases.
          # ------------------------------------------------------------------
          path = Path('catalog/lib/CatalogScanner.php')
          source = path.read_text()

          marker = "function scanner_package_name_from_reader(string $fallbackPackageName, string $readerEngine, array $names, array $header): string\n"
          helper = dedent(r'''
          function scanner_source_identity_path(string $sourceRelativePath): string
          {
              $sourceRelativePath = scanner_normalize_source_relative_path($sourceRelativePath);
              if ($sourceRelativePath === '') {
                  return '';
              }
              return preg_replace('/\.(uz|uz2|uz3)$/i', '', $sourceRelativePath) ?? $sourceRelativePath;
          }

          function scanner_package_name_from_source_identity(string $engineKey, string $sourceRelativePath, string $originalName = ''): string
          {
              $engineKey = strtoupper(trim($engineKey));
              $sourceRelativePath = scanner_source_identity_path($sourceRelativePath);
              if (in_array($engineKey, ['UE4', 'UE5'], true)) {
                  return scanner_ue_package_name_from_source_relative($sourceRelativePath);
              }

              $sourceOriginalName = scanner_original_name_from_source_relative($sourceRelativePath);
              if ($sourceOriginalName === '') {
                  $sourceOriginalName = $originalName;
              }
              return scanner_logical_package_name($sourceOriginalName);
          }

          ''')
          source = replace_once(source, marker, helper + marker, 'insert source identity helper')

          old = dedent('''
              $sourcePackageName = '';
              if (in_array($readerEngine, ['UE4', 'UE5'], true)) {
                  $sourcePackageName = scanner_ue_package_name_from_source_relative($sourceRelativePath);
                  if ($sourcePackageName === '') {
                      throw new RuntimeException('UE4 package identity requires a mounted source-relative path, matching UT4 FPackageName::FilenameToLongPackageName behaviour. Reimport using Local Source Scan, folder upload, PAK import, or a source manifest path; single loose UE4 files cannot be catalogued safely.');
                  }
                  $packageName = $sourcePackageName;
              } else {
                  $packageName = scanner_logical_package_name($originalName);
              }
          ''')
          new = dedent('''
              $sourcePackageName = scanner_package_name_from_source_identity($readerEngine, $sourceRelativePath, $originalName);
              if (in_array($readerEngine, ['UE4', 'UE5'], true) && $sourcePackageName === '') {
                  throw new RuntimeException('UE4 package identity requires a mounted source-relative path, matching UT4 FPackageName::FilenameToLongPackageName behaviour. Reimport using Local Source Scan, folder upload, PAK import, or a source manifest path; single loose UE4 files cannot be catalogued safely.');
              }
              $packageName = $sourcePackageName !== '' ? $sourcePackageName : scanner_logical_package_name($originalName);
          ''')
          source = replace_once(source, old, new, 'centralize scan package identity')

          scan_marker = "function scanner_scan_uploaded_file(PDO $db, array $config, int $gameId, string $tmp, string $originalName, ?int $userId, bool $strictProfile = true, ?callable $progress = null, bool $allowProfileOverride = false, array $scannerOptions = []): array\n"
          rebuild_function = dedent(r'''
          /**
           * Recalculate all derived package identity data from the mounted source
           * paths. The source path and parsed export local_path are authoritative;
           * package_name, export full_path and aliases are catalog projections.
           *
           * @param list<string> $previousPackageNames
           * @return array{changed:bool,file_id:int,old_package_name:string,new_package_name:string,alias_count:int,dependency_files_refreshed:int}
           */
          function scanner_rebuild_file_source_identity(PDO $db, array $config, int $fileId, ?callable $progress = null, bool $refreshDependencies = true, array $previousPackageNames = []): array
          {
              scanner_source_path_schema_ensure($db);
              catalog_package_aliases_ensure($db);

              $file = catalog_one(
                  $db,
                  'SELECT f.*, p.engine_key profile_engine'
                  . ' FROM ue_files f'
                  . ' JOIN ue_games g ON g.id=f.game_id'
                  . ' LEFT JOIN ue_game_profiles p ON p.id=g.profile_id'
                  . ' WHERE f.id=?',
                  [$fileId]
              );
              if (!$file) {
                  throw new RuntimeException('File no longer exists in the catalog.');
              }

              $engineKey = strtoupper(trim((string)($file['detected_engine_key'] ?? '')));
              if ($engineKey === '') {
                  $engineKey = strtoupper(trim((string)($file['profile_engine'] ?? '')));
              }

              $locations = catalog_all($db, 'SELECT * FROM ue_file_locations WHERE file_id=? ORDER BY id', [$fileId]);
              $primarySourcePath = scanner_source_identity_path((string)($file['source_relative_path'] ?? ''));
              if ($primarySourcePath === '') {
                  foreach ($locations as $location) {
                      $candidate = scanner_source_identity_path((string)($location['source_relative_path'] ?? ''));
                      if ($candidate !== '') {
                          $primarySourcePath = $candidate;
                          break;
                      }
                  }
              }

              $primaryPackageName = scanner_package_name_from_source_identity($engineKey, $primarySourcePath, (string)$file['original_name']);
              if ($primaryPackageName === '') {
                  throw new RuntimeException('A canonical package identity could not be derived from the stored source path. Re-import this file from a mounted source folder.');
              }

              $primaryOriginalName = scanner_original_name_from_source_relative($primarySourcePath);
              if ($primaryOriginalName === '') {
                  $primaryOriginalName = (string)$file['original_name'];
              }

              $sourcePaths = [];
              if ($primarySourcePath !== '') {
                  $sourcePaths[strtolower($primarySourcePath)] = $primarySourcePath;
              }
              foreach ($locations as $location) {
                  $candidate = scanner_source_identity_path((string)($location['source_relative_path'] ?? ''));
                  if ($candidate !== '') {
                      $sourcePaths[strtolower($candidate)] = $candidate;
                  }
              }

              $derivedAliases = [];
              foreach ($sourcePaths as $sourcePath) {
                  $packageName = scanner_package_name_from_source_identity($engineKey, $sourcePath, scanner_original_name_from_source_relative($sourcePath));
                  if ($packageName === '' || strcasecmp($packageName, $primaryPackageName) === 0) {
                      continue;
                  }
                  $derivedAliases[strtolower($packageName)] = [
                      'package_name' => $packageName,
                      'original_name' => scanner_original_name_from_source_relative($sourcePath),
                  ];
              }
              ksort($derivedAliases);

              $oldAliases = catalog_all($db, 'SELECT * FROM ue_file_package_aliases WHERE file_id=? ORDER BY package_name,id', [$fileId]);
              $oldAliasKeys = [];
              $oldPackageNames = array_merge($previousPackageNames, [(string)$file['package_name']]);
              foreach ($oldAliases as $alias) {
                  $name = trim((string)($alias['package_name'] ?? ''));
                  if ($name !== '') {
                      $oldAliasKeys[] = strtolower($name);
                      $oldPackageNames[] = $name;
                  }
              }
              sort($oldAliasKeys);
              $newAliasKeys = array_keys($derivedAliases);
              sort($newAliasKeys);

              $primaryChanged = strcasecmp((string)$file['package_name'], $primaryPackageName) !== 0;
              $sourceChanged = scanner_source_identity_path((string)($file['source_relative_path'] ?? '')) !== $primarySourcePath;
              $originalChanged = (string)$file['original_name'] !== $primaryOriginalName;
              $aliasesChanged = $oldAliasKeys !== $newAliasKeys;
              $changed = $primaryChanged || $sourceChanged || $originalChanged || $aliasesChanged;

              $newPackageNames = [$primaryPackageName];
              foreach ($derivedAliases as $alias) {
                  $newPackageNames[] = $alias['package_name'];
              }
              $allPackageNames = array_values(array_unique(array_filter(array_merge($oldPackageNames, $newPackageNames), static fn($name): bool => trim((string)$name) !== '')));

              $referringFileIds = [];
              if ($allPackageNames !== []) {
                  $sql = 'SELECT DISTINCT d.file_id'
                      . ' FROM ue_dependencies d'
                      . ' JOIN ue_files owner ON owner.id=d.file_id'
                      . ' WHERE owner.game_id=? AND d.file_id<>?'
                      . ' AND d.required_package IN (' . implode(',', array_fill(0, count($allPackageNames), '?')) . ')';
                  $args = [(int)$file['game_id'], $fileId, ...$allPackageNames];
                  foreach (catalog_all($db, $sql, $args) as $row) {
                      $referringFileIds[] = (int)$row['file_id'];
                  }
              }

              if ($changed) {
                  scanner_emit_percent($progress, 'identity', 10, 'Rebuilding canonical package identity from source path');
                  $db->beginTransaction();
                  try {
                      $db->prepare('UPDATE ue_files SET package_name=?,original_name=?,source_relative_path=? WHERE id=?')
                          ->execute([$primaryPackageName, $primaryOriginalName, $primarySourcePath !== '' ? $primarySourcePath : null, $fileId]);

                      if ($primaryChanged) {
                          $exports = catalog_all($db, 'SELECT id,local_path FROM ue_exports WHERE file_id=? ORDER BY export_index', [$fileId]);
                          $updateExport = $db->prepare('UPDATE ue_exports SET full_path=? WHERE id=?');
                          foreach ($exports as $export) {
                              $updateExport->execute([
                                  scanner_join_path_parts([$primaryPackageName, (string)$export['local_path']]),
                                  (int)$export['id'],
                              ]);
                          }
                      }

                      $db->prepare('DELETE FROM ue_file_package_aliases WHERE file_id=?')->execute([$fileId]);
                      $insertAlias = $db->prepare(
                          'INSERT INTO ue_file_package_aliases(file_id,game_id,package_name,original_name,package_guid,md5,file_size) VALUES(?,?,?,?,?,?,?)'
                      );
                      foreach ($derivedAliases as $alias) {
                          $insertAlias->execute([
                              $fileId,
                              (int)$file['game_id'],
                              $alias['package_name'],
                              $alias['original_name'] !== '' ? $alias['original_name'] : basename($alias['package_name']),
                              (string)($file['package_guid'] ?? '') !== '' ? (string)$file['package_guid'] : null,
                              (string)$file['md5'],
                              (int)$file['file_size'],
                          ]);
                      }

                      $db->commit();
                  } catch (Throwable $error) {
                      if ($db->inTransaction()) {
                          $db->rollBack();
                      }
                      throw $error;
                  }
              }

              $refreshed = 0;
              if ($refreshDependencies && ($changed || $previousPackageNames !== [])) {
                  $dependencyFileIds = array_values(array_unique(array_merge([$fileId], $referringFileIds)));
                  $dependencyFileIds = array_values(array_filter(
                      $dependencyFileIds,
                      static fn(int $id): bool => $id > 0 && (bool)catalog_one($db, 'SELECT id FROM ue_files WHERE id=?', [$id])
                  ));
                  $total = max(1, count($dependencyFileIds));
                  foreach ($dependencyFileIds as $index => $dependencyFileId) {
                      scanner_rebuild_dependencies(
                          $db,
                          $config,
                          $dependencyFileId,
                          $progress,
                          scanner_range_percent(20, 100, $index, $total),
                          scanner_range_percent(20, 100, $index + 1, $total),
                          'Refreshing dependencies after canonical identity rebuild ' . ($index + 1) . '/' . count($dependencyFileIds)
                      );
                      $refreshed++;
                  }
              } else {
                  scanner_emit_percent($progress, 'identity', 100, $changed ? 'Canonical package identity rebuilt' : 'Package identity already matches its source path');
              }

              return [
                  'changed' => $changed,
                  'file_id' => $fileId,
                  'old_package_name' => (string)$file['package_name'],
                  'new_package_name' => $primaryPackageName,
                  'alias_count' => count($derivedAliases),
                  'dependency_files_refreshed' => $refreshed,
              ];
          }

          ''')
          source = replace_once(source, scan_marker, rebuild_function + scan_marker, 'insert canonical identity rebuild')
          path.write_text(source)

          # ------------------------------------------------------------------
          # source-scan.php: even hash/GUID fast matches must register the
          # mounted source identity instead of bypassing canonicalization.
          # ------------------------------------------------------------------
          path = Path('catalog/source-scan.php')
          source = path.read_text()

          old = dedent('''
                      $file = catalog_one($db, 'SELECT id FROM ue_files WHERE game_id=? AND md5=? LIMIT 1', [(int)$source['game_id'], $md5]);
                      if ($file) {
                          record_file_location($db, $upsert, (int)$file['id'], $sourceId, $relative);
                          scanner_record_source_relative_path($db, (int)$file['id'], source_scan_scanner_relative_path($relative, $work));
                          $matchedMd5++;
                          $locations++;
                          continue;
                      }
          ''')
          new = dedent('''
                      $file = catalog_one($db, 'SELECT id FROM ue_files WHERE game_id=? AND md5=? LIMIT 1', [(int)$source['game_id'], $md5]);
                      if ($file) {
                          record_file_location($db, $upsert, (int)$file['id'], $sourceId, $relative);
                          scanner_record_source_relative_path($db, (int)$file['id'], source_scan_scanner_relative_path($relative, $work));
                          scanner_rebuild_file_source_identity($db, $config, (int)$file['id']);
                          $matchedMd5++;
                          $locations++;
                          continue;
                      }
          ''')
          source = replace_once(source, old, new, 'canonicalize MD5 fast match')

          old = dedent('''
                      if (count($matches) === 1) {
                          record_file_location($db, $upsert, (int)$matches[0]['id'], $sourceId, $relative);
                          scanner_record_source_relative_path($db, (int)$matches[0]['id'], source_scan_scanner_relative_path($relative, $work));
                          $matchedGuid++;
                          $locations++;
                          continue;
                      }
          ''')
          new = dedent('''
                      if (count($matches) === 1) {
                          record_file_location($db, $upsert, (int)$matches[0]['id'], $sourceId, $relative);
                          scanner_record_source_relative_path($db, (int)$matches[0]['id'], source_scan_scanner_relative_path($relative, $work));
                          scanner_rebuild_file_source_identity($db, $config, (int)$matches[0]['id']);
                          $matchedGuid++;
                          $locations++;
                          continue;
                      }
          ''')
          source = replace_once(source, old, new, 'canonicalize GUID fast match')
          path.write_text(source)

          # ------------------------------------------------------------------
          # file-maintenance.php: rebuild means source-identity rebuild;
          # reimport means parser reimport. Reimports preserve source locations,
          # then recalculate aliases from those locations rather than restoring
          # stale alias rows.
          # ------------------------------------------------------------------
          path = Path('catalog/file-maintenance.php')
          source = path.read_text()

          pattern = re.compile(r"/\*\* @return list<array<string,mixed>> \*/\nfunction catalog_maintenance_alias_rows.*?\nfunction catalog_maintenance_is_deadlock", re.S)
          replacement = dedent(r'''
          /** @return list<array<string,mixed>> */
          function catalog_maintenance_alias_rows(PDO $db, int $fileId): array
          {
              catalog_package_aliases_ensure($db);
              return catalog_all($db, 'SELECT * FROM ue_file_package_aliases WHERE file_id=? ORDER BY id', [$fileId]);
          }

          /** @return list<array<string,mixed>> */
          function catalog_maintenance_location_rows(PDO $db, int $fileId): array
          {
              return catalog_all($db, 'SELECT * FROM ue_file_locations WHERE file_id=? ORDER BY id', [$fileId]);
          }

          /** @param list<array<string,mixed>> $aliases @return list<string> */
          function catalog_maintenance_package_names(array $file, array $aliases): array
          {
              $names = [(string)($file['package_name'] ?? '')];
              foreach ($aliases as $alias) {
                  $names[] = (string)($alias['package_name'] ?? '');
              }
              $names = array_map('trim', $names);
              return array_values(array_unique(array_filter($names, static fn(string $name): bool => $name !== '')));
          }

          /** @param list<array<string,mixed>> $locations */
          function catalog_maintenance_restore_source_locations(PDO $db, int $oldFileId, int $newFileId, array $locations): void
          {
              $db->beginTransaction();
              try {
                  catalog_package_aliases_ensure($db);
                  $db->prepare('DELETE FROM ue_file_package_aliases WHERE file_id=?')->execute([$oldFileId]);

                  $insert = $db->prepare(
                      'INSERT INTO ue_file_locations(file_id,source_id,source_relative_path,exists_in_source,last_seen_at)'
                      . ' VALUES(?,?,?,?,?)'
                      . ' ON DUPLICATE KEY UPDATE exists_in_source=VALUES(exists_in_source),last_seen_at=VALUES(last_seen_at)'
                  );
                  foreach ($locations as $location) {
                      $insert->execute([
                          $newFileId,
                          (int)$location['source_id'],
                          (string)$location['source_relative_path'],
                          (int)$location['exists_in_source'],
                          $location['last_seen_at'],
                      ]);
                  }
                  $db->commit();
              } catch (Throwable $error) {
                  if ($db->inTransaction()) {
                      $db->rollBack();
                  }
                  throw $error;
              }
          }

          /** @return array{status:string,file_id:?int,game_id:int,original_name:string,message:string} */
          function catalog_maintenance_reimport_with_identity_refresh(PDO $db, array $config, int $fileId, ?int $userId, ?callable $progress): array
          {
              [$file, $resolvedFromStaleId] = catalog_maintenance_current_file(
                  $db,
                  $fileId,
                  'File no longer exists in the catalog. Refresh the file list before retrying.'
              );

              if ($resolvedFromStaleId) {
                  return [
                      'status' => 'stale_replaced',
                      'file_id' => (int)$file['id'],
                      'game_id' => (int)$file['game_id'],
                      'original_name' => (string)$file['original_name'],
                      'message' => 'Package already has a current catalog record after an earlier re-import.',
                  ];
              }

              $oldFileId = (int)$file['id'];
              $oldPackageNames = catalog_maintenance_package_names($file, catalog_maintenance_alias_rows($db, $oldFileId));
              $oldLocations = catalog_maintenance_location_rows($db, $oldFileId);

              $storedPath = catalog_file_maintenance_storage_path($config, $file);
              if ($storedPath === null || !is_file($storedPath)) {
                  $removed = catalog_file_maintenance_remove($db, $config, $oldFileId, $progress);
                  catalog_package_aliases_ensure($db);
                  $db->prepare('DELETE FROM ue_file_package_aliases WHERE file_id=?')->execute([$oldFileId]);
                  return [
                      'status' => 'removed_missing',
                      'file_id' => null,
                      'game_id' => (int)$removed['game_id'],
                      'original_name' => (string)$removed['original_name'],
                      'message' => 'Stored package was missing; removed its catalog record, aliases, tables, locations, and dependency references.',
                  ];
              }

              $result = catalog_file_maintenance_reimport($db, $config, $oldFileId, $userId, $progress);
              $newFileId = (int)$result['file_id'];
              catalog_maintenance_restore_source_locations($db, $oldFileId, $newFileId, $oldLocations);

              $refreshDependencies = (string)($_POST['operation'] ?? '') !== 'sync_reimport';
              $identity = scanner_rebuild_file_source_identity(
                  $db,
                  $config,
                  $newFileId,
                  $progress,
                  $refreshDependencies,
                  $oldPackageNames
              );

              return [
                  'status' => 'reimported',
                  'file_id' => $newFileId,
                  'game_id' => (int)$result['game_id'],
                  'original_name' => (string)$result['original_name'],
                  'message' => (string)$result['message']
                      . '; canonical package=' . $identity['new_package_name']
                      . '; source-derived aliases=' . $identity['alias_count']
                      . '; dependency files refreshed=' . $identity['dependency_files_refreshed'],
              ];
          }

          function catalog_maintenance_is_deadlock''')
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'replace maintenance identity region: expected one match, found {count}')

          old = dedent('''
              $fileId = catalog_maintenance_file_id();
              if ($operation === 'reimport' || $operation === 'rebuild') {
                  $result = catalog_maintenance_with_write_lock(
                      $db,
                      $progress,
                      static fn() => catalog_maintenance_reimport_with_identity_refresh($db, $config, $fileId, $userId, $progress)
                  );
                  catalog_maintenance_redirect_or_reply([
                      'ok' => true,
                      'status' => $result['status'],
                      'message' => $result['status'] === 'reimported'
                          ? 'Rebuilt ' . $result['original_name'] . ' from its preserved source path. ' . $result['message']
                          : $result['message'],
                      'return_url' => 'game-files.php?id=' . (int)$result['game_id'],
                  ], $operation, $postProgressToken);
              }
          ''')
          new = dedent('''
              $fileId = catalog_maintenance_file_id();
              if ($operation === 'rebuild') {
                  [$file] = catalog_maintenance_current_file($db, $fileId, 'File no longer exists in the catalog.');
                  $identity = catalog_maintenance_with_write_lock(
                      $db,
                      $progress,
                      static fn() => scanner_rebuild_file_source_identity($db, $config, (int)$file['id'], $progress, true)
                  );
                  catalog_maintenance_redirect_or_reply([
                      'ok' => true,
                      'status' => $identity['changed'] ? 'identity_rebuilt' : 'identity_current',
                      'message' => $identity['changed']
                          ? 'Rebuilt canonical package identity from the mounted source path: ' . $identity['old_package_name'] . ' → ' . $identity['new_package_name'] . '. Aliases=' . $identity['alias_count'] . '; dependency files refreshed=' . $identity['dependency_files_refreshed'] . '.'
                          : 'Package identity already matches the mounted source path. No catalog identity changes were required.',
                      'return_url' => 'game-files.php?id=' . (int)$file['game_id'],
                  ], $operation, $postProgressToken);
              }

              if ($operation === 'reimport') {
                  $result = catalog_maintenance_with_write_lock(
                      $db,
                      $progress,
                      static fn() => catalog_maintenance_reimport_with_identity_refresh($db, $config, $fileId, $userId, $progress)
                  );
                  catalog_maintenance_redirect_or_reply([
                      'ok' => true,
                      'status' => $result['status'],
                      'message' => $result['status'] === 'reimported'
                          ? 'Re-imported ' . $result['original_name'] . ' through the parser. ' . $result['message']
                          : $result['message'],
                      'return_url' => 'game-files.php?id=' . (int)$result['game_id'],
                  ], $operation, $postProgressToken);
              }
          ''')
          source = replace_once(source, old, new, 'separate rebuild from reimport')
          path.write_text(source)

          # ------------------------------------------------------------------
          # game-files.php: expose the two distinct operations accurately.
          # ------------------------------------------------------------------
          path = Path('catalog/game-files.php')
          source = path.read_text()
          old = dedent('''
                  $html .= '<form method="post" action="file-maintenance.php" title="Rebuild dependency links for this game">';
                  $html .= '<input type="hidden" name="csrf" value="' . catalog_h($csrf) . '">';
                  $html .= '<input type="hidden" name="file_id" value="' . $fileId . '">';
                  $html .= '<input type="hidden" name="operation" value="rebuild">';
                  $html .= '<button type="submit" class="game-files-admin-button" aria-label="Rebuild dependency links" title="Rebuild dependency links for this game">↻</button>';
                  $html .= '</form>';
          ''')
          new = dedent('''
                  $html .= '<form method="post" action="file-maintenance.php" title="Rebuild canonical package identity from its mounted source path">';
                  $html .= '<input type="hidden" name="csrf" value="' . catalog_h($csrf) . '">';
                  $html .= '<input type="hidden" name="file_id" value="' . $fileId . '">';
                  $html .= '<input type="hidden" name="operation" value="rebuild">';
                  $html .= '<button type="submit" class="game-files-admin-button" aria-label="Rebuild package identity" title="Rebuild package identity, export paths, source-derived aliases and affected dependencies">↻</button>';
                  $html .= '</form>';
                  $html .= '<form method="post" action="file-maintenance.php" title="Re-import this package through the parser">';
                  $html .= '<input type="hidden" name="csrf" value="' . catalog_h($csrf) . '">';
                  $html .= '<input type="hidden" name="file_id" value="' . $fileId . '">';
                  $html .= '<input type="hidden" name="operation" value="reimport">';
                  $html .= '<button type="submit" class="game-files-admin-button" aria-label="Re-import package" title="Re-import package bytes through the parser using the preserved mounted source path">⟳</button>';
                  $html .= '</form>';
          ''')
          source = replace_once(source, old, new, 'separate identity rebuild and parser reimport buttons')
          path.write_text(source)

          # Static checks before PHP lint.
          scanner = Path('catalog/lib/CatalogScanner.php').read_text()
          maintenance = Path('catalog/file-maintenance.php').read_text()
          source_scan = Path('catalog/source-scan.php').read_text()
          ui = Path('catalog/game-files.php').read_text()
          assert 'function scanner_rebuild_file_source_identity' in scanner
          assert scanner.count('scanner_rebuild_file_source_identity($db, $config') >= 2
          assert source_scan.count('scanner_rebuild_file_source_identity($db, $config') == 2
          assert "if ($operation === 'rebuild')" in maintenance
          assert "if ($operation === 'reimport')" in maintenance
          assert 'operation\" value=\"reimport' in ui
