name: Dispatch original filename fix

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.issue.title == '[automation] preserve original filenames'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch patch workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run one-time-preserve-original-filenames.yml --repo "${{ github.repository }}" --ref main
