name: Archive recovery regression

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Archive recovery contracts
        run: php catalog/bin/verify-corrupt-archive-handling-contract.php
      - name: Upload worker contracts
        run: php catalog/bin/verify-upload-worker-contracts.php
      - name: PHP syntax
        run: |
          php -l catalog/src/Infrastructure/Jobs/CatalogJobDisplayStatus.php
          php -l catalog/src/Infrastructure/Jobs/CatalogBucketStagedPackageJobHandler.php
          php -l catalog/src/Infrastructure/Persistence/PdoBackgroundJobBulkAction.php
      - name: JavaScript syntax
        run: node --check catalog/assets/background-jobs-archive-errors.js
