name: Catalog quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, mbstring, openssl, sodium, zip
          coverage: none
      - name: Reject tracked runtime configuration
        run: |
          if git ls-files --error-unmatch catalog/config.php >/dev/null 2>&1; then
            echo 'catalog/config.php must not be tracked.'
            exit 1
          fi
      - name: Syntax lint PHP files
        run: |
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -n1 php -l
      - name: Syntax check shell commands
        run: |
          sh -n deploy/docker/worker-loop.sh
          sh -n deploy/docker/maintenance-loop.sh
          sh -n deploy/backup/unrealdb-backup.sh
          sh -n deploy/backup/unrealdb-restore.sh
      - name: Syntax check dependency refresh client
        run: node --check catalog/assets/dependency-refresh-jobs.js
      - name: Syntax check source identity repair client
        run: node --check catalog/assets/source-identity-repair-jobs.js
      - name: Syntax check duplicate cleanup client
        run: node --check catalog/assets/unverified-duplicate-cleanup.js
      - name: Syntax check generated package client
        run: node --check catalog/assets/generated-package-jobs.js
      - name: Syntax check profiled upload client
        run: node --check catalog/assets/profiled-upload-jobs.js
      - name: Syntax check pak import client
        run: node --check catalog/assets/pak-import-jobs.js
      - name: Verify architecture boundaries
        run: php catalog/tests/architecture-boundaries-test.php
      - name: Verify security boundaries
        run: php catalog/tests/security-boundaries-test.php
      - name: Verify full review completion boundaries
        run: php catalog/tests/review-completion-contract-test.php
      - name: Test MFA and application secret services
        run: php catalog/tests/security-services-test.php
      - name: Verify explicit staging boundaries
        run: php catalog/tests/unverified-staging-contract-test.php
      - name: Verify original filename and legacy package-name preservation
        run: php catalog/tests/original-filename-contract-test.php
      - name: Verify background job reliability boundaries
        run: php catalog/tests/job-reliability-contract-test.php
      - name: Verify queued dependency refresh boundaries
        run: php catalog/tests/dependency-refresh-job-contract-test.php
      - name: Verify queued source identity repair boundaries
        run: php catalog/tests/source-identity-job-contract-test.php
      - name: Verify durable storage and package boundaries
        run: php catalog/tests/storage-package-job-contract-test.php
      - name: Test synthetic UE1-UE4 reader fixtures
        run: php catalog/tests/reader-fixtures-test.php
      - name: Test federation secret encryption
        run: php catalog/tests/federation-secret-store-test.php
      - name: Test catalog UI components
        run: php catalog/tests/ui-components-test.php
      - name: Test unverified duplicate cleanup
        run: php catalog/tests/unverified-duplicate-service-test.php
      - name: Validate generated package formats
        run: php catalog/tests/mod-package-format-test.php

  fresh-schema:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: unrealdb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, sodium, zip
          coverage: none
      - name: Import canonical baseline
        run: mysql -h 127.0.0.1 -uroot -proot unrealdb_test < catalog/install.sql
      - name: Test ordered schema upgrade
        env:
          UNREALDB_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=unrealdb_test;charset=utf8mb4
          UNREALDB_TEST_DB_USER: root
          UNREALDB_TEST_DB_PASSWORD: root
        run: php catalog/tests/migration-integration-test.php
      - name: Test explicit unverified staging
        env:
          UNREALDB_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=unrealdb_test;charset=utf8mb4
          UNREALDB_TEST_DB_USER: root
          UNREALDB_TEST_DB_PASSWORD: root
        run: php catalog/tests/unverified-staging-integration-test.php
      - name: Test background job leases and concurrency
        env:
          UNREALDB_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=unrealdb_test;charset=utf8mb4
          UNREALDB_TEST_DB_USER: root
          UNREALDB_TEST_DB_PASSWORD: root
        run: php catalog/tests/job-queue-integration-test.php
      - name: Test background job resource limits and fairness
        env:
          UNREALDB_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=unrealdb_test;charset=utf8mb4
          UNREALDB_TEST_DB_USER: root
          UNREALDB_TEST_DB_PASSWORD: root
        run: php catalog/tests/job-resource-limits-integration-test.php
      - name: Test queued dependency refresh execution
        env:
          UNREALDB_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=unrealdb_test;charset=utf8mb4
          UNREALDB_TEST_DB_USER: root
          UNREALDB_TEST_DB_PASSWORD: root
        run: php catalog/tests/dependency-refresh-job-integration-test.php
      - name: Test queued source identity repair execution
        env:
          UNREALDB_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=unrealdb_test;charset=utf8mb4
          UNREALDB_TEST_DB_USER: root
          UNREALDB_TEST_DB_PASSWORD: root
        run: php catalog/tests/source-identity-job-integration-test.php
      - name: Test durable storage cleanup and package generation
        env:
          UNREALDB_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=unrealdb_test;charset=utf8mb4
          UNREALDB_TEST_DB_USER: root
          UNREALDB_TEST_DB_PASSWORD: root
        run: php catalog/tests/storage-package-jobs-integration-test.php
      - name: Verify required catalog tables
        run: |
          for table in \
            ue_games ue_users ue_files ue_names ue_imports ue_exports ue_dependencies \
            ue_sources ue_file_locations ue_game_profiles ue_federation_settings \
            ue_federation_peers ue_federation_transfer_jobs ue_app_logs ue_background_jobs \
            ue_schema_migrations ue_remember_tokens ue_file_package_aliases \
            ue_asset_registry_assets ue_asset_registry_tags ue_asset_registry_dependencies; do
            mysql -h 127.0.0.1 -uroot -proot unrealdb_test \
              -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='unrealdb_test' AND table_name='$table'" \
              | grep -qx '1'
          done
      - name: Verify federation and MFA migration columns
        run: |
          for column in signature_algorithm signing_public_key signing_key_id signing_rotated_at signing_revoked_at; do
            mysql -h 127.0.0.1 -uroot -proot unrealdb_test \
              -Nse "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='unrealdb_test' AND table_name='ue_federation_peers' AND column_name='$column'" \
              | grep -qx '1'
          done
          for column in mfa_totp_secret mfa_recovery_codes_json mfa_enabled_at mfa_last_used_step; do
            mysql -h 127.0.0.1 -uroot -proot unrealdb_test \
              -Nse "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='unrealdb_test' AND table_name='ue_users' AND column_name='$column'" \
              | grep -qx '1'
          done
      - name: Verify reusable profile assignments
        run: |
          mysql -h 127.0.0.1 -uroot -proot unrealdb_test \
            -Nse "SELECT COUNT(*) FROM ue_games g JOIN ue_game_profiles p ON p.id=g.profile_id WHERE p.game_id IS NULL AND p.profile_name <> ''" \
            | awk '$1 >= 4 { ok=1 } END { exit ok ? 0 : 1 }'
      - name: Verify clean install seed data
        run: |
          mysql -h 127.0.0.1 -uroot -proot unrealdb_test \
            -Nse "SELECT COUNT(*) FROM ue_games" | awk '$1 >= 4 { ok=1 } END { exit ok ? 0 : 1 }'
