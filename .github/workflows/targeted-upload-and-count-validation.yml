name: Upload bucket and game counts validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, mbstring, openssl, sodium, zip, zlib
          coverage: none
      - name: PHP syntax
        run: |
          php -l catalog/api/v1/upload-bucket-chunk.php
          php -l catalog/api/v1/game-missing-counts.php
          php -l catalog/games.php
          php -l catalog/library.php
          php -l catalog/lib/CatalogSupport.php
          php -l catalog/tests/upload-bucket-profile-policy-contract-test.php
          php -l catalog/tests/game-missing-counts-contract-test.php
          php -l tests/catalog_redirect_payload_test.php
      - name: JavaScript syntax
        run: node --check catalog/assets/game-manager-missing-counts.js
      - name: Redirect archive regression tests
        run: |
          php tests/catalog_redirect_archive_test.php
          php tests/catalog_redirect_payload_test.php
      - name: Upload bucket contract
        run: php catalog/tests/upload-bucket-profile-policy-contract-test.php
      - name: Game missing count contract
        run: php catalog/tests/game-missing-counts-contract-test.php
