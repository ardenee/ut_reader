name: One-time complete review runtime safety

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, zip
          coverage: none
      - name: Apply guarded runtime transformations
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          scanner = Path('catalog/lib/CatalogScanner.php')
          text = scanner.read_text()

          pattern = re.compile(r'function scanner_source_path_schema_ensure\(PDO \$db\): void\n\{.*?\n\}\n\nfunction scanner_record_source_relative_path', re.S)
          replacement = '''function scanner_source_path_schema_ensure(PDO $db): void
          {
              static $done = false;
              if ($done) {
                  return;
              }
              $exists = catalog_one(
                  $db,
                  'SELECT COUNT(*) c FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND COLUMN_NAME="source_relative_path"'
              );
              if ((int)($exists['c'] ?? 0) === 0) {
                  throw new RuntimeException('The database schema is not migrated: ue_files.source_relative_path is missing. Run php catalog/bin/migrate.php migrate followed by verify.');
              }
              $done = true;
          }

          function scanner_record_source_relative_path'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('scanner source-path schema function marker did not match exactly once')

          old_storage = '''    $storedFileCreated = false;
              if (is_file($dest)) {
                  if (is_file($tmp) && !@unlink($tmp)) {
                      throw new RuntimeException('Could not discard duplicate physical upload');
                  }
              } elseif (!rename($tmp, $dest)) {
                  throw new RuntimeException('Could not store upload');
              } else {
                  $storedFileCreated = true;
              }
          '''
          new_storage = '''    $storedFileCreated = false;
              if (!is_file($dest)) {
                  if (!@copy($tmp, $dest)) {
                      throw new RuntimeException('Could not copy upload into verified storage');
                  }
                  @chmod($dest, 0640);
                  $storedFileCreated = true;
              }
          '''
          if text.count(old_storage) != 1:
              raise SystemExit('scanner verified-storage block did not match exactly once')
          text = text.replace(old_storage, new_storage, 1)

          old_commit_tail = '''        throw $e;
              }

              $refreshWarning = '';
          '''
          new_commit_tail = '''        throw $e;
              }

              if (is_file($tmp) && !@unlink($tmp)) {
                  error_log('[UnrealDB scanner] Imported file committed but temporary source could not be removed: ' . basename($tmp));
              }

              $refreshWarning = '';
          '''
          if text.count(old_commit_tail) != 1:
              raise SystemExit('scanner transaction tail did not match exactly once')
          text = text.replace(old_commit_tail, new_commit_tail, 1)
          scanner.write_text(text)

          unverified = Path('catalog/lib/CatalogUnverifiedIndex.php')
          text = unverified.read_text()
          pattern = re.compile(r'function catalog_unverified_schema_ensure\(PDO \$db\): void\n\{.*?\n\}\n\nfunction catalog_unverified_queue_key', re.S)
          replacement = '''function catalog_unverified_schema_ensure(PDO $db): void
          {
              static $done = false;
              if ($done) {
                  return;
              }

              $missing = [];
              foreach (['unverified_queue_key', 'unverified_queue_game_id', 'unverified_queue_name', 'unverified_reason', 'source_relative_path'] as $column) {
                  $exists = catalog_one($db, 'SELECT COUNT(*) c FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND COLUMN_NAME=?', [$column]);
                  if ((int)($exists['c'] ?? 0) === 0) {
                      $missing[] = 'ue_files.' . $column;
                  }
              }
              $gameId = catalog_one($db, 'SELECT IS_NULLABLE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND COLUMN_NAME="game_id"');
              if (!$gameId || strtoupper((string)$gameId['IS_NULLABLE']) !== 'YES') {
                  $missing[] = 'nullable ue_files.game_id';
              }
              $status = catalog_one($db, 'SELECT COLUMN_TYPE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND COLUMN_NAME="scan_status"');
              if (!$status || !str_contains(strtolower((string)$status['COLUMN_TYPE']), "'unverified'")) {
                  $missing[] = 'ue_files.scan_status unverified value';
              }
              foreach (['uq_ue_files_unverified_queue_key', 'idx_ue_files_scan_status', 'idx_ue_files_unverified_queue'] as $index) {
                  $exists = catalog_one($db, 'SELECT COUNT(*) c FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME="ue_files" AND INDEX_NAME=?', [$index]);
                  if ((int)($exists['c'] ?? 0) === 0) {
                      $missing[] = 'index ' . $index;
                  }
              }
              if ($missing !== []) {
                  throw new RuntimeException('The database schema is not migrated. Missing: ' . implode(', ', $missing) . '. Run php catalog/bin/migrate.php migrate followed by verify.');
              }
              $done = true;
          }

          function catalog_unverified_queue_key'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('unverified schema function marker did not match exactly once')
          unverified.write_text(text)

          candidates = list(Path('catalog').glob('*.php')) + list(Path('catalog/federation').glob('*.php'))
          removals = [
              "session_start();\n",
              "error_reporting(E_ALL);\n",
              "ini_set('display_errors', '1');\n",
              "ini_set('display_startup_errors', '1');\n",
              'ini_set("display_errors", "1");\n',
              'ini_set("display_startup_errors", "1");\n',
          ]
          for path in candidates:
              source = path.read_text()
              if 'CatalogSupport.php' not in source:
                  continue
              updated = source
              for removal in removals:
                  updated = updated.replace(removal, '')
              if updated != source:
                  path.write_text(updated)
          PY

      - name: Validate transformed PHP
        run: |
          php -l catalog/lib/CatalogScanner.php
          php -l catalog/lib/CatalogUnverifiedIndex.php
          git diff --name-only -- '*.php' | while read -r file; do php -l "$file"; done
          if grep -R --include='*.php' -nE "ini_set\(['\"]display_(startup_)?errors['\"], *['\"]1['\"]\)" catalog --exclude-dir=tests --exclude-dir=migrations; then
            echo 'Browser display_errors override remains.'
            exit 1
          fi
          if grep -R --include='*.php' -nE 'ALTER TABLE|CREATE TABLE|CREATE INDEX' catalog/lib catalog/src/Infrastructure/Persistence --exclude='SchemaInspector.php'; then
            echo 'Runtime DDL remains outside migrations/install tooling.'
            exit 1
          fi
          git diff --check

      - name: Commit transformation and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-time-complete-review-runtime.yml
          git add catalog/lib/CatalogScanner.php catalog/lib/CatalogUnverifiedIndex.php catalog/*.php catalog/federation/*.php
          git commit -m "runtime: remove ddl and harden storage commits"
          git push
