name: One-time fix obfuscated package name strings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      - name: Correct legacy serialized-name termination
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          functions = {
              Path('UE1/UnrealPackageReader.php'): '''    private function stringByLength(int $length): string
          {
              if ($length === 0) {
                  return '';
              }

              if ($length > 0) {
                  if ($length > 65536 || $length > $this->remaining()) {
                      throw new OutOfBoundsException("bad string length=$length pos={$this->pos} remaining={$this->remaining()}");
                  }
                  $raw = self::trimAnsiTerminator($this->bytes($length));
                  return self::escapeNameControls(self::toUtf8($raw));
              }

              $chars = -$length;
              $bytes = $chars * 2;
              if ($chars > 32768 || $bytes > $this->remaining()) {
                  throw new OutOfBoundsException("bad wide string length=$length pos={$this->pos} remaining={$this->remaining()}");
              }
              $raw = self::trimWideTerminator($this->bytes($bytes));
              $out = @mb_convert_encoding($raw, 'UTF-8', 'UTF-16LE');
              return $out === false ? '' : self::escapeNameControls($out);
          }

          private static function trimAnsiTerminator(string $raw): string
          {
              $terminator = strpos($raw, "\\0");
              return $terminator === false ? $raw : substr($raw, 0, $terminator);
          }

          private static function trimWideTerminator(string $raw): string
          {
              $length = strlen($raw);
              for ($offset = 0; $offset + 1 < $length; $offset += 2) {
                  if ($raw[$offset] === "\\0" && $raw[$offset + 1] === "\\0") {
                      return substr($raw, 0, $offset);
                  }
              }
              return $raw;
          }

          private static function escapeNameControls(string $text): string
          {
              return preg_replace_callback(
                  '/[\\x00-\\x1F\\x7F]/',
                  static fn(array $match): string => sprintf('%%%02X', ord($match[0])),
                  $text
              ) ?? $text;
          }

          public static function toUtf8''',
              Path('UE2/UnrealPackageReader.php'): '''    private function stringByLength(int $length): string
          {
              if ($length === 0) {
                  return '';
              }
              if ($length > 0) {
                  if ($length > 65536 || $length > $this->remaining()) {
                      throw new OutOfBoundsException("bad FString length=$length pos={$this->pos} remaining={$this->remaining()}");
                  }
                  $raw = self::trimAnsiTerminator($this->bytes($length));
                  return self::escapeNameControls(self::toUtf8($raw));
              }
              $chars = -$length;
              $bytes = $chars * 2;
              if ($chars > 32768 || $bytes > $this->remaining()) {
                  throw new OutOfBoundsException("bad wide FString length=$length pos={$this->pos} remaining={$this->remaining()}");
              }
              $raw = self::trimWideTerminator($this->bytes($bytes));
              $out = @mb_convert_encoding($raw, 'UTF-8', 'UTF-16LE');
              return $out === false ? '' : self::escapeNameControls($out);
          }

          private static function trimAnsiTerminator(string $raw): string
          {
              $terminator = strpos($raw, "\\0");
              return $terminator === false ? $raw : substr($raw, 0, $terminator);
          }

          private static function trimWideTerminator(string $raw): string
          {
              $length = strlen($raw);
              for ($offset = 0; $offset + 1 < $length; $offset += 2) {
                  if ($raw[$offset] === "\\0" && $raw[$offset + 1] === "\\0") {
                      return substr($raw, 0, $offset);
                  }
              }
              return $raw;
          }

          private static function escapeNameControls(string $text): string
          {
              return preg_replace_callback(
                  '/[\\x00-\\x1F\\x7F]/',
                  static fn(array $match): string => sprintf('%%%02X', ord($match[0])),
                  $text
              ) ?? $text;
          }

          public static function toUtf8''',
              Path('UE3/UnrealPackageReader.php'): '''    private function stringByLength(int $length): string
          {
              if ($length === 0) return '';
              if ($length > 0) {
                  if ($length > 65536 || $length > $this->remaining()) throw new OutOfBoundsException("bad FString length=$length pos={$this->pos} remaining={$this->remaining()}");
                  $raw = self::trimAnsiTerminator($this->bytes($length));
                  return self::escapeNameControls(self::toUtf8($raw));
              }
              $chars = -$length;
              $bytes = $chars * 2;
              if ($chars > 32768 || $bytes > $this->remaining()) throw new OutOfBoundsException("bad wide FString length=$length pos={$this->pos} remaining={$this->remaining()}");
              $raw = self::trimWideTerminator($this->bytes($bytes));
              $out = @mb_convert_encoding($raw, 'UTF-8', 'UTF-16LE');
              return $out === false ? '' : self::escapeNameControls($out);
          }

          private static function trimAnsiTerminator(string $raw): string
          {
              $terminator = strpos($raw, "\\0");
              return $terminator === false ? $raw : substr($raw, 0, $terminator);
          }

          private static function trimWideTerminator(string $raw): string
          {
              $length = strlen($raw);
              for ($offset = 0; $offset + 1 < $length; $offset += 2) {
                  if ($raw[$offset] === "\\0" && $raw[$offset + 1] === "\\0") {
                      return substr($raw, 0, $offset);
                  }
              }
              return $raw;
          }

          private static function escapeNameControls(string $text): string
          {
              return preg_replace_callback(
                  '/[\\x00-\\x1F\\x7F]/',
                  static fn(array $match): string => sprintf('%%%02X', ord($match[0])),
                  $text
              ) ?? $text;
          }

          public static function toUtf8''',
          }

          pattern = re.compile(
              r'    private function stringByLength\(int \$length\): string\n    \{.*?\n    \}\n\n    public static function toUtf8',
              re.S,
          )

          for path, replacement in functions.items():
              source = path.read_text()
              updated, count = pattern.subn(replacement, source, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: stringByLength block drifted')
              old_cstring = 'return self::toUtf8($out);'
              if old_cstring not in updated:
                  raise SystemExit(f'{path}: cstring return drifted')
              updated = updated.replace(
                  old_cstring,
                  'return self::escapeNameControls(self::toUtf8($out));',
                  1,
              )
              path.write_text(updated)
          PY

      - name: Add explicit regression test
        run: |
          cat > catalog/tests/reader-name-sanitization-test.php <<'PHP'
          <?php
          declare(strict_types=1);

          require_once __DIR__ . '/../lib/CatalogParser.php';

          function name_test_expect(bool $condition, string $message): void
          {
              if (!$condition) {
                  throw new RuntimeException($message);
              }
          }

          function name_test_compact(int $value): string
          {
              $negative = $value < 0;
              $magnitude = abs($value);
              $first = $magnitude & 0x3F;
              $magnitude >>= 6;
              if ($negative) $first |= 0x80;
              if ($magnitude > 0) $first |= 0x40;
              $result = chr($first);
              while ($magnitude > 0) {
                  $next = $magnitude & 0x7F;
                  $magnitude >>= 7;
                  if ($magnitude > 0) $next |= 0x80;
                  $result .= chr($next);
              }
              return $result;
          }

          function name_test_i32(int $value): string
          {
              return pack('V', $value & 0xFFFFFFFF);
          }

          $config = [
              'engine_readers' => [
                  'UE1' => ['reader' => '../UE1/UnrealPackageReader.php'],
                  'UE2' => ['reader' => '../UE2/UnrealPackageReader.php'],
                  'UE3' => ['reader' => '../UE3/UnrealPackageReader.php'],
              ],
          ];
          $ansi = "SafeName\0\x1F\x20\0";
          $control = "\x10\0";
          $wide = "S\0a\0f\0e\0\0\0X\0\0\0";
          $wideChars = intdiv(strlen($wide), 2);

          catalog_load_reader_class($config, 'UE1');
          $ue1Class = 'UnrealDb\\Catalog\\Infrastructure\\Readers\\RuntimeLegacy\\UE1\\UE1BinaryReader';
          name_test_expect(class_exists($ue1Class, false), 'UE1 binary reader was not loaded.');
          $reader = new $ue1Class(name_test_compact(strlen($ansi)) . $ansi);
          name_test_expect($reader->fstringCompact(69) === 'SafeName', 'UE1 retained bytes after the first ANSI terminator.');
          $reader = new $ue1Class(name_test_compact(-$wideChars) . $wide);
          name_test_expect($reader->fstringCompact(69) === 'Safe', 'UE1 retained characters after the first wide terminator.');
          $reader = new $ue1Class(name_test_compact(strlen($control)) . $control);
          name_test_expect($reader->fstringCompact(69) === '%10', 'UE1 did not escape a control-only name.');
          $reader = new $ue1Class($control);
          name_test_expect($reader->cstring() === '%10', 'UE1 C-string control byte was not escaped.');

          catalog_load_reader_class($config, 'UE2');
          $ue2Class = 'UnrealDb\\Catalog\\Infrastructure\\Readers\\RuntimeLegacy\\UE2\\UEFolderBinaryReader';
          name_test_expect(class_exists($ue2Class, false), 'UE2 binary reader was not loaded.');
          $reader = new $ue2Class(name_test_compact(strlen($ansi)) . $ansi);
          name_test_expect($reader->fstringIndex(128) === 'SafeName', 'UE2 retained bytes after the first ANSI terminator.');
          $reader = new $ue2Class(name_test_compact(-$wideChars) . $wide);
          name_test_expect($reader->fstringIndex(128) === 'Safe', 'UE2 retained characters after the first wide terminator.');
          $reader = new $ue2Class(name_test_compact(strlen($control)) . $control);
          name_test_expect($reader->fstringIndex(128) === '%10', 'UE2 did not escape a control-only name.');
          $reader = new $ue2Class($control);
          name_test_expect($reader->cstring() === '%10', 'UE2 C-string control byte was not escaped.');

          catalog_load_reader_class($config, 'UE3');
          name_test_expect(class_exists('UEFolderBinaryReader', false), 'UE3 binary reader was not loaded.');
          $reader = new UEFolderBinaryReader(name_test_i32(strlen($ansi)) . $ansi);
          name_test_expect($reader->fstring32() === 'SafeName', 'UE3 retained bytes after the first ANSI terminator.');
          $reader = new UEFolderBinaryReader(name_test_i32(-$wideChars) . $wide);
          name_test_expect($reader->fstring32() === 'Safe', 'UE3 retained characters after the first wide terminator.');
          $reader = new UEFolderBinaryReader(name_test_i32(strlen($control)) . $control);
          name_test_expect($reader->fstring32() === '%10', 'UE3 did not escape a control-only name.');
          $reader = new UEFolderBinaryReader($control);
          name_test_expect($reader->cstring() === '%10', 'UE3 C-string control byte was not escaped.');

          fwrite(STDOUT, "Obfuscated package name sanitization tests passed.\n");
          PHP

          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/catalog-quality.yml')
          source = workflow.read_text()
          test_step = "      - name: Test obfuscated package name handling\n        run: php catalog/tests/reader-name-sanitization-test.php\n"
          if test_step not in source:
              anchor = "      - name: Test synthetic UE1-UE4 reader fixtures\n        run: php catalog/tests/reader-fixtures-test.php\n"
              if anchor not in source:
                  raise SystemExit('Catalog quality reader fixture step drifted')
              source = source.replace(anchor, anchor + test_step, 1)
              workflow.write_text(source)
          PY

      - name: Validate readers
        run: |
          php -l UE1/UnrealPackageReader.php
          php -l UE2/UnrealPackageReader.php
          php -l UE3/UnrealPackageReader.php
          php -l catalog/tests/reader-name-sanitization-test.php
          php catalog/tests/reader-name-sanitization-test.php
          php catalog/tests/reader-fixtures-test.php

      - name: Commit fix and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-time-fix-obfuscated-name-strings.yml
          git add UE1/UnrealPackageReader.php UE2/UnrealPackageReader.php UE3/UnrealPackageReader.php catalog/tests/reader-name-sanitization-test.php .github/workflows/catalog-quality.yml
          git commit -m 'fix: stop legacy names at embedded terminators'
          git pull --rebase origin main
          git push origin HEAD:main
