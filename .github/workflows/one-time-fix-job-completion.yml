name: One-time job completion fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-fix-job-completion.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix completion parameter count
        shell: python
        run: |
          from pathlib import Path

          path = Path('catalog/src/Infrastructure/Persistence/PdoJobQueue.php')
          text = path.read_text(encoding='utf-8')
          old = """                self::encodeJson($result),
                self::encodeJson(['stage' => 'completed']),
                $now,
                $now,
                $now,
                $now,
                $job->id,
                $job->leaseToken,
"""
          new = """                self::encodeJson($result),
                self::encodeJson(['stage' => 'completed']),
                $now,
                $now,
                $now,
                $job->id,
                $job->leaseToken,
"""
          if old not in text:
              raise SystemExit('Expected completion parameter block was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validate and commit
        shell: bash
        run: |
          php -l catalog/src/Infrastructure/Persistence/PdoJobQueue.php
          rm .github/workflows/one-time-fix-job-completion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/src/Infrastructure/Persistence/PdoJobQueue.php .github/workflows/one-time-fix-job-completion.yml
          git commit -m "fix: correct background job completion parameters"
          git push origin HEAD:main
