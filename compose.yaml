name: unrealdb

x-unrealdb-environment: &unrealdb-environment
  UNREALDB_DB_HOST: mysql
  UNREALDB_DB_PORT: 3306
  UNREALDB_DB_NAME: unrealdb
  UNREALDB_DB_USER: unrealdb
  UNREALDB_DB_PASSWORD: ${UNREALDB_DB_PASSWORD:-change-this-database-password}
  UNREALDB_SITE_NAME: ${UNREALDB_SITE_NAME:-Unreal File Catalog}
  UNREALDB_STORAGE_PATH: /var/www/html/catalog/storage
  UNREALDB_SESSION_COOKIE_SECURE: ${UNREALDB_SESSION_COOKIE_SECURE:-0}
  UNREALDB_SESSION_REDIS_DSN: tcp://redis:6379?database=1&timeout=2.5&read_timeout=2.5
  UNREALDB_CATALOG_SESSION_IDLE_SECONDS: ${UNREALDB_CATALOG_SESSION_IDLE_SECONDS:-1800}
  UNREALDB_CATALOG_SESSION_ABSOLUTE_SECONDS: ${UNREALDB_CATALOG_SESSION_ABSOLUTE_SECONDS:-43200}
  UNREALDB_LOGIN_MAX_ATTEMPTS: ${UNREALDB_LOGIN_MAX_ATTEMPTS:-8}
  UNREALDB_LOGIN_WINDOW_SECONDS: ${UNREALDB_LOGIN_WINDOW_SECONDS:-900}
  UNREALDB_LOGIN_BLOCK_SECONDS: ${UNREALDB_LOGIN_BLOCK_SECONDS:-900}
  UNREALDB_API_MAX_JSON_BYTES: ${UNREALDB_API_MAX_JSON_BYTES:-1048576}
  UNREALDB_FEDERATION_MAX_JSON_BYTES: ${UNREALDB_FEDERATION_MAX_JSON_BYTES:-8388608}
  UNREALDB_REDIRECT_MAX_OUTPUT_BYTES: ${UNREALDB_REDIRECT_MAX_OUTPUT_BYTES:-268435456}
  UNREALDB_ALLOW_LEGACY_QUERY_TOKENS: ${UNREALDB_ALLOW_LEGACY_QUERY_TOKENS:-0}
  UNREALDB_FEDERATION_MASTER_KEY: ${UNREALDB_FEDERATION_MASTER_KEY:-}
  UNREALDB_REQUIRE_ENCRYPTED_FEDERATION_SECRETS: ${UNREALDB_REQUIRE_ENCRYPTED_FEDERATION_SECRETS:-0}
  UNREALDB_QUEUE_NAME: catalog
  UNREALDB_QUEUE_LEASE_SECONDS: 120
  UNREALDB_JOB_RESOURCE_LIMIT_DEPENDENCY_HEAVY: ${UNREALDB_JOB_RESOURCE_LIMIT_DEPENDENCY_HEAVY:-1}
  UNREALDB_JOB_RESOURCE_LIMIT_STORAGE_HEAVY: ${UNREALDB_JOB_RESOURCE_LIMIT_STORAGE_HEAVY:-1}
  UNREALDB_JOB_RESOURCE_LIMIT_PACKAGE_HEAVY: ${UNREALDB_JOB_RESOURCE_LIMIT_PACKAGE_HEAVY:-1}
  UNREALDB_JOB_RESOURCE_LIMIT_HOUSEKEEPING: ${UNREALDB_JOB_RESOURCE_LIMIT_HOUSEKEEPING:-2}
  UNREALDB_JOB_RESOURCE_LIMIT_DEFAULT: ${UNREALDB_JOB_RESOURCE_LIMIT_DEFAULT:-4}
  UNREALDB_GENERATED_PACKAGE_RETENTION_SECONDS: ${UNREALDB_GENERATED_PACKAGE_RETENTION_SECONDS:-86400}
  UNREALDB_PACKAGE_GENERATION_MAX_REQUESTS: ${UNREALDB_PACKAGE_GENERATION_MAX_REQUESTS:-3}
  UNREALDB_PACKAGE_GENERATION_WINDOW_SECONDS: ${UNREALDB_PACKAGE_GENERATION_WINDOW_SECONDS:-600}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: unrealdb
      MYSQL_USER: unrealdb
      MYSQL_PASSWORD: ${UNREALDB_DB_PASSWORD:-change-this-database-password}
      MYSQL_ROOT_PASSWORD: ${UNREALDB_DB_ROOT_PASSWORD:-change-this-root-password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --max-allowed-packet=256M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
      - ./catalog/install.sql:/docker-entrypoint-initdb.d/001-install.sql:ro

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  migrate:
    image: unrealdb:${APP_VERSION:-local}
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment: *unrealdb-environment
    command:
      - php
      - /var/www/html/catalog/bin/migrate.php
      - migrate
      - --lock-timeout=60

  web:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: unrealdb:${APP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *unrealdb-environment
    ports:
      - "${UNREALDB_HTTP_PORT:-8080}:8080"
    volumes:
      - catalog-storage:/var/www/html/catalog/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/catalog/api/v1/health.php"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  worker:
    image: unrealdb:${APP_VERSION:-local}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      web:
        condition: service_started
    environment:
      <<: *unrealdb-environment
      UNREALDB_WORKER_MAX_JOBS: ${UNREALDB_WORKER_MAX_JOBS:-100}
      UNREALDB_WORKER_SLEEP_MS: ${UNREALDB_WORKER_SLEEP_MS:-250}
      UNREALDB_WORKER_IDLE_SECONDS: ${UNREALDB_WORKER_IDLE_SECONDS:-2}
      UNREALDB_WORKER_ERROR_SECONDS: ${UNREALDB_WORKER_ERROR_SECONDS:-10}
    command: ["/var/www/html/deploy/docker/worker-loop.sh"]
    volumes:
      - catalog-storage:/var/www/html/catalog/storage

volumes:
  mysql-data:
  redis-data:
  catalog-storage:
